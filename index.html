<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(assets/fonts/nunito-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

/* Палитра — одно место (PROTO-BASE §9). Сиреневый фон как на референсе; 3D-фон рисует шейдер теми же цветами (VIEW.BG_*). */
:root{
  --bg:#2a2140; --frame:#9d86f0; --ink:#ffffff; --ink2:#3a2a7a; --muted:#e6defe;
  --panel:#6b4fd8; --panel2:#5a3fc4; --accent:#ffd23a; --accent-ink:#4a2a00; --danger:#ff4d6d; --card:#fbf8ff;
  --frame-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 "Nunito", system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(#c9b8ff,#8b72e8);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
header .title{display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 0 rgba(60,30,140,.35)}
header .title b{font-size:20px;font-weight:900;letter-spacing:.2px} header .title span{font-size:13px;color:var(--muted)}
header button{pointer-events:auto}
.ico{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);box-shadow:0 4px 0 var(--panel2);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico.off .wave{display:none} .ico:not(.off) .slash{display:none}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 66px);z-index:2;text-align:center;font-size:15px;color:#fff;padding:0 24px;pointer-events:none;
  text-shadow:0 2px 0 rgba(60,30,140,.35)}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s}
#game canvas.ready{opacity:1}
footer{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(107,79,216,0),rgba(90,63,196,.35))}
footer button{flex:1;max-width:120px;height:56px;border:0;border-radius:16px;background:var(--panel);box-shadow:0 5px 0 var(--panel2);color:#fff;font:inherit;font-weight:800;font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
footer button svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
footer button:disabled{opacity:.5}
footer button.pulse{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 #d79c00;animation:pulse 1s ease-in-out infinite}
footer button.pulse svg{stroke:var(--accent-ink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
button:active{transform:translateY(2px)}
#dead{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px);z-index:4;display:none;background:rgba(255,255,255,.96);color:var(--ink2);border-radius:18px;
  padding:12px 14px;box-shadow:0 8px 24px rgba(40,10,110,.35);font-size:15px;line-height:1.3}
#dead.show{display:flex;gap:10px;align-items:center}
#dead b{color:var(--danger);display:block;font-size:22px;font-weight:1000;letter-spacing:.3px}
/* v0.6.1, П-2: тупик картинкой — застрявший цвет ✕ его банка, без букв и без текста причины (как «● ⚡ ▲» в «Замкни цепь») */
#dead .pic{display:flex;align-items:center;flex:none;gap:0} #dead .pic svg{width:36px;height:40px;display:block} #dead .pic svg.x{width:24px;height:24px}
#dead .txt{flex:1}
#dead button{flex:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:900;padding:10px 12px;box-shadow:0 4px 0 #d79c00;cursor:pointer}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(48,24,120,.45);padding:20px}
#overlay.show{display:flex}
.card{background:var(--card);color:var(--ink2);border-radius:26px;padding:24px 20px;max-width:350px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(30,10,90,.4);
  animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}  /* стартует с видимого состояния (§9) */
.card h1.logo{margin:0 0 6px;font-size:44px;font-weight:1000;color:#fff;-webkit-text-stroke:2px var(--ink2);text-shadow:0 4px 0 var(--ink2)}
.card h2{margin:0 0 8px;font-size:30px;font-weight:1000} .card p{color:#6a5aa8;margin:0 0 16px;font-weight:700}
.card button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:12px 16px;background:#ece6ff;color:var(--ink2);cursor:pointer;margin:4px}
.card button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #d79c00}
.card button.big{font-size:20px;padding:14px 22px;width:100%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.levels .lv{margin:0;padding:12px 0;font-size:18px}
.levels .lv.done{background:#c8f5d4;color:#1f6b38} .levels .lv.cur{outline:3px solid var(--panel)}
.rules{text-align:left;padding-left:18px;margin:0 0 14px;color:#4b3b8c;font-weight:700} .rules li{margin:6px 0}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:4;background:rgba(40,20,100,.88);color:#fff;padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;max-width:86%;text-align:center;font-size:15px}
#toast.hide{opacity:0}
/* подсказка картинкой (уровни 1–2): палец тапает или ведёт подкову; рисует JS по положению подковы на экране */
#pic{position:absolute;inset:0;z-index:2;pointer-events:none;display:none}
#pic.show{display:block}
#pic svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
/* карточка победы: без цифр — слово, лучи, искры, одна кнопка. Кейфреймы стартуют с видимого состояния (§9) */
#overlay.win{background:radial-gradient(90% 60% at 50% 34%, rgba(255,236,170,.42), rgba(52,26,128,.40) 78%)}
.card.wincard{background:none;box-shadow:none;padding:0;position:relative;overflow:visible;margin-top:-30vh;animation:none;color:#fff}
.wincard .burst{position:absolute;left:50%;top:34px;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,245,200,.55) 0deg 8deg, rgba(255,245,200,0) 8deg 20deg);
  -webkit-mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.8) 22%, transparent 64%); mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.8) 22%, transparent 64%);
  animation:wspin 16s linear infinite, wburst .7s cubic-bezier(.2,1.5,.4,1) both}
.wincard .glow{position:absolute;left:50%;top:34px;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,251,225,.95), rgba(255,222,120,.4) 42%, rgba(255,222,120,0) 70%);animation:wbreath 1.8s ease-in-out infinite}
.wincard .word{position:relative;font-size:clamp(46px,15vw,66px);font-weight:1000;line-height:1.05;white-space:nowrap;color:#ffe15a;
  -webkit-text-stroke:3px #3b1b8f;paint-order:stroke fill;text-shadow:0 6px 0 #3b1b8f,0 14px 28px rgba(40,10,110,.45)}
.wincard .word span{display:inline-block;animation:wletter .6s cubic-bezier(.2,1.8,.35,1) both, wbob 1.9s ease-in-out infinite}
.wincard .sp{position:absolute;display:block;pointer-events:none;animation:wtw 1.5s ease-in-out infinite;background:radial-gradient(circle,#fff 0 22%,#ffe98a 48%,#ffc928 75%);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}   /* звёздочка без глифа: ✦ нет в Nunito, поиск запасного шрифта стоил кадр в 1 с */
.wincard button.go{position:relative;margin-top:40px;width:auto;min-width:230px;font-size:24px;padding:16px 36px;border-radius:22px;overflow:hidden;
  box-shadow:0 6px 0 #d79c00,0 10px 30px rgba(255,200,40,.5);animation:wgo .5s .45s cubic-bezier(.2,1.7,.4,1) both, pulse 1.3s 1.3s ease-in-out infinite}
.wincard button.go::after{content:'';position:absolute;top:0;bottom:0;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);animation:wshine 2.4s 1.1s ease-in-out infinite}
@keyframes wspin{to{rotate:360deg}}
@keyframes wburst{from{scale:.3}to{scale:1}}
@keyframes wbreath{50%{scale:1.14}}
@keyframes wletter{from{transform:translateY(-38px) scale(.4) rotate(-16deg)}to{transform:none}}
@keyframes wbob{50%{translate:0 -6px}}
@keyframes wtw{0%,100%{scale:.55;rotate:0deg}50%{scale:1.2;rotate:35deg}}
@keyframes wgo{from{scale:.55}to{scale:1}}
@keyframes wshine{0%{left:-70%}55%,100%{left:135%}}
@media (prefers-reduced-motion: reduce){ .wincard *, .wincard *::after{animation:none!important} }
@media (prefers-reduced-motion: reduce){ .card{animation:none} #toast{transition:none} footer button.pulse{animation:none} }
</style>

</div>

// выпуска пролетает мимо неё. Подкова того же размера под выпуском перекрыла бы оба выпуска верхней.

//            lock — цвет банки, снимающей замок.
//   Банка: id, цвет c, объём cap, x (стоит на полке). Куда что сыплется — из геометрии (dropFrom), руками дороги не задаются.
//   pic — подсказка картинкой на первых уровнях: 'tap' — палец тапает, 'drag' — палец ведёт подкову против часовой.
//   warn — урок «туда ему не дойти» (v0.6.1, П-7): зажатая подкова красным показывает, что ход ведёт в тупик. Только на 3-м:
//          на остальных такое превью сняло бы ловушку.
// Малая подкова под выпуском большой: x = x_A ± (OFF + OFF·s), OFF = sin 22,5° — её вход ровно под выпуском.
// Порядок подков = номера ходов: ход m = 2·подкова + (0 — по часовой, 1 — против).
const OFF = Math.sin(22.5 * Math.PI / 180), SMALL = 0.65, XS = +(OFF + OFF * SMALL).toFixed(4);
const LEVELS = [
  // 1. Тап — подкова щёлкает, нижний конец над воронкой — песок сыплется. Одна подкова, одна банка точно под ней.
  { n: 1, name: 'Сыпь', hint: '', pic: 'tap',
    rings: [{ id: 'A', x: 0, y: 1.6, fill: 'pp', o: 7 }],
    jars:  [{ id: 'jp', c: 'p', cap: 2, x: 0 }] },

  // 2. Банка берёт только свой цвет: розовый конец висит над голубой воронкой и не сыплется. Тянешь против часовой —
  //    розовый уходит вправо, в розовую; дальше голубой — влево (тапом или ещё раз против часовой). Тапами тоже можно, дольше.
  { n: 2, name: 'Свой цвет', hint: '', pic: 'drag',
    rings: [{ id: 'A', x: 0, y: 1.6, fill: 'bbp', o: 3 }],
    jars:  [{ id: 'jb', c: 'b', cap: 2, x: -0.72 }, { id: 'jp', c: 'p', cap: 1, x: 0.72 }] },

  // 3. Первое «ага» — «С какого конца»: голубой конец висит над оранжевой воронкой, голубая банка — под малой подковой B справа.
  //    Тап (по часовой) ставит вправо ОРАНЖЕВЫЙ конец — он падает в B, а под B только голубая банка: тупик.
  //    Верно — против часовой: голубой в B, потом оранжевый влево, потом B отдаёт голубой.
  { n: 3, name: 'С какого конца', hint: '', warn: 1,
    rings: [{ id: 'A', x: 0, y: 3.6, fill: 'bboo', o: 1 }, { id: 'B', x: XS, y: 1.55, s: SMALL, fill: '', o: 4 }],
    jars:  [{ id: 'jo', c: 'o', cap: 2, x: -0.62 }, { id: 'jb', c: 'b', cap: 2, x: XS }] },

  // 4. Подставь конец (передышка): A над B того же размера — оба выпуска A сыплют в B, если её конец стоит под струёй.
  //    Под B две банки. Столбик не даёт тупиков: B отдаёт любой конец в любую сторону.
  { n: 4, name: 'Подставь', hint: '',
    rings: [{ id: 'A', x: 0, y: 4.3, fill: 'bbp', o: 2 }, { id: 'B', x: 0, y: 1.7, fill: '', o: 4 }],
    jars:  [{ id: 'jb', c: 'b', cap: 2, x: -0.72 }, { id: 'jp', c: 'p', cap: 1, x: 0.72 }] },

  // 5. Развилка: A сыплет вправо в малую B (над голубой) и влево в малую C (над розовой). Розовый — в середине цепочки:
  //    голубой в B, розовый в C, голубой в B — три тапа. Против часовой первым — голубой падает в C: тупик.
  { n: 5, name: 'Развилка', hint: '',
    rings: [{ id: 'A', x: 0, y: 4.65, fill: 'bpb', o: 7 }, { id: 'B', x: XS, y: 2.65, s: SMALL, fill: '', o: 4 }, { id: 'C', x: -XS, y: 1.55, s: SMALL, fill: '', o: 5 }],
    jars:  [{ id: 'jp', c: 'p', cap: 1, x: -XS }, { id: 'jb', c: 'b', cap: 2, x: XS }] },

  // 6. Замок: та же развилка, но C не крутится, пока не насыпана голубая. Розовый ждёт в C, пока B не отдаст голубой.
  //    Голубой первым — в B, розовый — в C (её вход открыт с начала), B отдаёт голубой — замок слетает — C отдаёт розовый.
  { n: 6, name: 'Замок', hint: '',
    rings: [{ id: 'A', x: 0, y: 4.65, fill: 'bbpp', o: 7 }, { id: 'B', x: XS, y: 2.65, s: SMALL, fill: '', o: 4 }, { id: 'C', x: -XS, y: 1.55, s: SMALL, fill: '', o: 5, lock: 'b' }],
    jars:  [{ id: 'jp', c: 'p', cap: 2, x: -XS }, { id: 'jb', c: 'b', cap: 2, x: XS }] },

  // 7. Ступени: A над B (столбик), у B справа малая C над голубой; левый выпуск B — в оранжевую.
  //    Всё из A идёт через B; оранжевый с той стороны, где C, — тупик. Оранжевый первым в B, потом голубые, B отдаёт оранжевый влево,
  //    голубые — в C.
  { n: 7, name: 'Ступени', hint: '',
    rings: [{ id: 'A', x: -0.4, y: 6.05, fill: 'bbo', o: 2 }, { id: 'B', x: -0.4, y: 3.55, fill: '', o: 4 }, { id: 'C', x: +(-0.4 + XS).toFixed(4), y: 1.55, s: SMALL, fill: '', o: 4 }],
    jars:  [{ id: 'jo', c: 'o', cap: 1, x: -1.02 }, { id: 'jb', c: 'b', cap: 2, x: +(-0.4 + XS).toFixed(4) }] },
];

// ---- геометрия (общая для рендера и проверки раскладки) ----
function ringById(L, id){ return L.rings.find(r => r.id === id); }
function jarById(L, id){ return L.jars.find(j => j.id === id); }
function ringIndex(L, id){ return L.rings.findIndex(r => r.id === id); }
function jarIndex(L, id){ return L.jars.findIndex(j => j.id === id); }
function jarHeight(cap){ return cap * CFG.JAR_DOSE_H + 0.3; }
function funnelTop(J){ return CFG.JAR_FLOOR + jarHeight(J.cap) + CFG.FUNNEL_H; }
function posNorm(k){ return ((k % CFG.POS) + CFG.POS) % CFG.POS; }
function ringCap(L, ri){ return L.rings[ri].cap || CFG.RING_CAP; }
function ringR(r){ return CFG.RING_R * (r.s || 1); }
function tubeR(r){ return CFG.TUBE_R * (r.s || 1); }
const DEG = Math.PI / 180;
// Точка на осевой линии подковы под углом θ (градусы от дна по часовой).
function rimAt(r, deg){ const R = ringR(r); return { x: r.x - R * Math.sin(deg * DEG), y: r.y - R * Math.cos(deg * DEG) }; }
function spotPos(r, spot){ return rimAt(r, SPOT_DEG[spot]); }
// Угол конца e подковы в положении o.
function endDeg(o, e){ return -22.5 + 45 * o + (e ? 270 : 0); }
// Дороги уровня: что под выпуском, что над входом.
function valveAt(L, ri, spot){ const id = L.rings[ri].id; return L.valves.find(v => v.from === id && v.at === spot) || null; }
function inletValve(L, ri, spot){ const id = L.rings[ri].id; return L.valves.find(v => v.to === id && v.in === spot) || null; }
// Куда падает песок с выпуска at подковы ri: отвесно вниз до первого, во что упрётся струя (с запасом на её ширину).
// { to, in } — приёмник; { err } — струя бьёт в стекло, в край воронки или падает мимо.
function dropFrom(L, ri, at){
  const r = L.rings[ri], p = spotPos(r, at), w = CFG.STREAM_R;
  for (let y = p.y - tubeR(r) - 0.02; y > CFG.JAR_FLOOR - 0.2; y -= 0.01){
    for (let qi = 0; qi < L.rings.length; qi++){
      if (qi === ri) continue;
      const q = L.rings[qi], R = ringR(q), T = tubeR(q);
      const near = [-w, 0, w].some(dx => Math.abs(Math.hypot(p.x + dx - q.x, y - q.y) - R) < T);
      if (!near) continue;
      for (const spot of ['TL', 'TR']){ const t = spotPos(q, spot); if (Math.abs(t.x - p.x) < CFG.ALIGN && Math.abs(t.y - y) < T + 0.1) return { to: q.id, in: spot, y: t.y }; }
      return { err: 'струя с ' + r.id + at + ' бьёт в стекло подковы ' + q.id };
    }
    for (const J of L.jars){
      if (y > funnelTop(J) || Math.abs(p.x - J.x) > CFG.FUNNEL_W / 2 + w) continue;
      if (Math.abs(p.x - J.x) > CFG.CATCH) return { err: 'струя с ' + r.id + at + ' бьёт в край воронки ' + J.id };
      return { to: J.id, y: funnelTop(J) };
    }
  }
  return { err: 'с ' + r.id + at + ' песок сыпался бы мимо: под выпуском ни воронки, ни подковы' };
}
// Дороги выводятся из геометрии один раз на уровень (L.valves). force — пересчитать (инструменты двигают подковы).
function deriveDrops(L, force){
  if (L._drops && !force) return L.valves;
  const valves = [], errs = [];
  L.rings.forEach((r, ri) => { for (const at of ['BL', 'BR']){ const d = dropFrom(L, ri, at);
    if (d.err) errs.push(d.err); else valves.push({ id: r.id + at, from: r.id, at, to: d.to, ...(d.in ? { in: d.in } : {}), c: '' }); } });
  L.valves = valves; L._dropErrs = errs; L._drops = true;
  return valves;
}
// Струя: от выпуска отвесно вниз до воронки или до входа подковы ниже.
function valvePath(L, v){
  const p0 = spotPos(ringById(L, v.from), v.at), J = jarById(L, v.to);
  return [p0, { x: p0.x, y: J ? funnelTop(J) : spotPos(ringById(L, v.to), v.in).y }];
}
// Куда съезжает цепочка из n доз в положении o (ячейка s стоит на θ = 45°·(o + s)): сумма высот минимальна.
// При равенстве — ближе к тому месту, где была (prev). Ядру это не нужно (сыпется всегда с нижнего конца), рендер и тест — пользуются.
function restOffset(o, n, prev){
  const cap = CFG.RING_CAP; let best = 0, bv = Infinity;
  for (let p = 0; p <= cap - n; p++){
    let v = 0; for (let j = 0; j < n; j++) v -= Math.cos(45 * (o + p + j) * DEG);
    const better = v < bv - 1e-9 || (Math.abs(v - bv) <= 1e-9 && prev !== undefined && Math.abs(p - prev) < Math.abs(best - prev));
    if (better){ bv = v; best = p; }
  }
  return best;
}

// Проверка раскладки уровня. Возвращает список ошибок.
function layoutErrors(L){
  const out = [];
  for (let i = 0; i < L.rings.length; i++) for (let k = i + 1; k < L.rings.length; k++){
    const a = L.rings[i], b = L.rings[k], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < ringR(a) + tubeR(a) + ringR(b) + tubeR(b) + CFG.RING_GAP) out.push('подковы ' + a.id + ' и ' + b.id + ' задевают друг друга (d=' + d.toFixed(2) + ')');
  }
  const top = Math.max(...L.jars.map(funnelTop));
  for (const r of L.rings) if (r.y - ringR(r) - tubeR(r) < top + 0.12) out.push('подкова ' + r.id + ' опускается в воронки банок');
  for (let i = 0; i < L.jars.length; i++) for (let k = i + 1; k < L.jars.length; k++)
    if (Math.abs(L.jars[i].x - L.jars[k].x) < Math.max(CFG.JAR_W, CFG.FUNNEL_W) + 0.06) out.push('банки ' + L.jars[i].id + ' и ' + L.jars[k].id + ' налезают');
  deriveDrops(L, true);
  out.push(...L._dropErrs);
  for (const v of L.valves){ const ti = ringIndex(L, v.to), P = valvePath(L, v);
    if (ti >= 0 && P[0].y - P[1].y < 0.3) out.push('с ' + v.id + ' в подкову ' + v.to + ': падать меньше 0,3 — струи не видно'); }
  for (const J of L.jars) if (!L.valves.some(v => v.to === J.id)) out.push('банка ' + J.id + ': над ней ни одного выпуска');
  for (const j of L.jars) if (!(j.cap >= 1)) out.push('банка ' + j.id + ': объём ' + j.cap);
  for (const c of new Set([...L.jars.map(j => j.c), ...L.rings.flatMap(r => [...r.fill])])){
    const need = L.jars.filter(j => j.c === c).reduce((s, j) => s + j.cap, 0);
    const have = L.rings.reduce((s, r) => s + [...r.fill].filter(x => x === c).length, 0);
    if (have !== need) out.push('песка ' + c + ' не столько, сколько нужно банкам (' + have + ' ≠ ' + need + ')');
  }
  L.rings.forEach((r, ri) => {
    if (r.fill.length > ringCap(L, ri)) out.push('подкова ' + r.id + ' переполнена');
    if (!(r.o >= 0 && r.o < CFG.POS)) out.push('подкова ' + r.id + ': стартовое положение ' + r.o);
    if (r.lock && !L.jars.some(j => j.c === r.lock)) out.push('подкова ' + r.id + ': замок цвета без банки');
  });
  // на старте ни один конец не стоит над приёмником, который берёт (иначе песок висел бы над открытой воронкой)
  if (!out.length){ const s = createState(-1, L); L.rings.forEach((r, ri) => { const f = flowFor(s, ri, s.ang[ri]); if (f.code === 'ok') out.push('подкова ' + r.id + ': на старте конец уже сыплет в ' + f.to); }); }
  return out;
}

// ---- состояние ----
function createState(li, def){
  const L = def || LEVELS[li]; deriveDrops(L);
  return { li, L, rings: L.rings.map(r => [...r.fill]), ang: L.rings.map(r => posNorm(r.o || 0)), jars: L.jars.map(() => 0), moves: 0, hist: [] };
}
function cloneState(s){ return { li: s.li, L: s.L, rings: s.rings.map(r => r.slice()), ang: s.ang.slice(), jars: s.jars.slice(), moves: s.moves, hist: s.hist.slice() }; }
function stateKey(s){ return s.rings.map(r => r.join('')).join('|') + '@' + s.ang.join('') + '#' + s.jars.join(','); }
function jarFull(s, ji){ return s.jars[ji] >= s.L.jars[ji].cap; }
function lockOpen(s, color){ return s.L.jars.some((j, ji) => j.c === color && jarFull(s, ji)); }
function ringLocked(s, ri){ const c = s.L.rings[ri].lock; return !!c && !lockOpen(s, c); }
const moveOf = (ri, dir) => ri * 2 + (dir > 0 ? 0 : 1);
function endColor(arr, e){ return arr.length ? (e ? arr[arr.length - 1] : arr[0]) : null; }

// Пересыпание по дороге v (струя вниз) из подковы si (положение so). recv — {ri, o}: положение подковы-приёмника, если она только что щёлкнула.
// code: ok | empty | wrongValve | wrongJar | jarFull | closedBelow | ringFull
function pourVia(s, v, si, so, recv, base){
  const L = s.L, src = s.rings[si], E = END_AT[so], n = src.length;
  const out = { ...base, src: si, srcId: L.rings[si].id, srcEnd: E.e, spot: v.at, valve: v.id, vc: v.c || '', to: v.to, color: null, amount: 0 };
  if (!n) return { ...out, code: 'empty' };
  const c = endColor(src, E.e); out.color = c;
  if (v.c && v.c !== c) return { ...out, code: 'wrongValve' };
  let run = 0; while (run < n && src[E.e ? n - 1 - run : run] === c) run++;
  let space;
  const ji = jarIndex(L, v.to);
  if (ji >= 0){
    const J = L.jars[ji];
    if (J.c !== c) return { ...out, code: 'wrongJar', jarColor: J.c };
    space = J.cap - s.jars[ji]; if (space <= 0) return { ...out, code: 'jarFull' };
    out.ji = ji;
  } else {
    const ti = ringIndex(L, v.to), to = recv && recv.ri === ti ? recv.o : s.ang[ti], TE = END_AT[to];
    out.ti = ti;
    if (TE.spot !== v.in) return { ...out, code: 'closedBelow' };
    space = ringCap(L, ti) - s.rings[ti].length; if (space <= 0) return { ...out, code: 'ringFull' };
    out.toEnd = TE.e;
  }
  return { ...out, code: 'ok', amount: Math.min(run, space), run };
}
// Что случится, когда подкова ri встанет в положение o. code: ok (сыплется) | rest (ничего) | closed (под нижним концом ничего — в v0.6 раскладка такого не допускает) | locked | …(pourVia)
function flowFor(s, ri, o){
  const L = s.L, E = END_AT[posNorm(o)], base = { ri, from: L.rings[ri].id, k: posNorm(o), end: E.e, at: E.spot };
  if (OUTLET[E.spot]){
    const v = valveAt(L, ri, E.spot);
    if (!v) return { ...base, code: 'closed', color: endColor(s.rings[ri], E.e), amount: 0 };
    return pourVia(s, v, ri, posNorm(o), null, base);
  }
  const v = inletValve(L, ri, E.spot);
  if (!v) return { ...base, code: 'rest', amount: 0 };
  const si = ringIndex(L, v.from);
  if (END_AT[s.ang[si]].spot !== v.at) return { ...base, code: 'rest', amount: 0, inlet: v.id };
  return pourVia(s, v, si, s.ang[si], { ri, o: posNorm(o) }, { ...base, feed: true });
}
// Ход m: щелчок подковы m>>1 по часовой (m чётный) или против. Возвращает положение после щелчка и что пересыплется.
function moveInfo(s, m){
  const ri = m >> 1, dir = (m & 1) ? -1 : 1;
  if (ri >= s.L.rings.length) return { m, ri, dir, code: 'none', amount: 0 };
  if (ringLocked(s, ri)) return { m, ri, dir, from: s.L.rings[ri].id, code: 'locked', lock: s.L.rings[ri].lock, k: s.ang[ri], amount: 0 };
  return { m, dir, ...flowFor(s, ri, s.ang[ri] + dir) };
}
function legalMoves(s){ const out = []; for (let ri = 0; ri < s.L.rings.length; ri++) if (!ringLocked(s, ri)) out.push(ri * 2, ri * 2 + 1); return out; }
function applyMove(s, m){
  const info = moveInfo(s, m); if (info.code === 'locked' || info.code === 'none') return s;
  const n = cloneState(s), L = s.L;
  n.hist.push({ rings: s.rings, ang: s.ang, jars: s.jars });
  n.ang[info.ri] = info.k;
  if (info.code === 'ok'){
    const src = n.rings[info.src];
    if (info.srcEnd) src.splice(src.length - info.amount, info.amount); else src.splice(0, info.amount);   // уходит только с нижнего конца
    if (info.ji !== undefined) n.jars[info.ji] += info.amount;
    else { const dst = n.rings[info.ti]; for (let q = 0; q < info.amount; q++){ if (info.toEnd) dst.push(info.color); else dst.unshift(info.color); } }
  }
  n.moves++;
  return n;
}
function undoMove(s){ if (!s.hist.length) return s; const n = cloneState(s), h = n.hist.pop(); n.rings = h.rings.map(r => r.slice()); n.ang = h.ang.slice(); n.jars = h.jars.slice(); n.moves--; return n; }
function isWin(s){ return s.jars.every((f, ji) => f >= s.L.jars[ji].cap); }
function jarDoses(s){ return s.jars.reduce((a, b) => a + b, 0); }

// Солвер: поиск в ширину по «положения × цепочки × банки», кратчайшая победная последовательность щелчков или null (тупик).
function solve(s){
  if (isWin(s)) return [];
  const start = { rings: s.rings.map(r => r.slice()), ang: s.ang.slice(), jars: s.jars.slice(), L: s.L, hist: [], moves: 0 };
  const seen = new Map([[stateKey(start), null]]), q = [start];
  for (let qi = 0; qi < q.length && seen.size < CFG.SOLVE_LIMIT; qi++){
    const cur = q[qi], ck = stateKey(cur);
    for (const m of legalMoves(cur)){
      const nx = applyMove(cur, m); nx.hist = []; const k = stateKey(nx);
      if (seen.has(k)) continue;
      seen.set(k, { from: ck, move: m });
      if (isWin(nx)){ const path = []; let at = k; while (seen.get(at)){ path.push(seen.get(at).move); at = seen.get(at).from; } return path.reverse(); }
      q.push(nx);
    }
  }
  return null;
}
// Полный граф уровня: сколько состояний, сколько тупиков; good — множество состояний, откуда победа достижима;
// dist — щелчков до победы из состояния (обратный поиск в ширину от побед). Строится генератором: sim и тесты прогоняют его разом
// (graphOf), игра — порциями между кадрами (graphAsync), чтобы большой уровень не подвешивал экран.
const GRAPH = new WeakMap(), GRAPH_PENDING = new WeakMap();
function* graphGen(L){
  const s = createState(-1, L), seen = new Map(), q = [s]; seen.set(stateKey(s), { win: isWin(s), next: [] });
  for (let qi = 0; qi < q.length && seen.size < CFG.SOLVE_LIMIT; qi++){
    const cur = q[qi], ck = stateKey(cur);
    for (const m of legalMoves(cur)){
      const nx = applyMove(cur, m); nx.hist = []; const k = stateKey(nx);
      seen.get(ck).next.push(k);
      if (!seen.has(k)){ seen.set(k, { win: isWin(nx), next: [] }); q.push(nx); }
    }

// ---- причина тупика человеческими словами ----

function routeTo(L, ri, c, seen){

  }
  for (const [ji, J] of L.jars.entries()){

  }

    if (jarFull(s, ji)) continue; const C = COLORS[J.c];
    for (let ri = 0; ri < L.rings.length; ri++) if (s.rings[ri].includes(J.c) && !routeTo(L, ri, J.c))
      return cap1(C.nom) + ' попал в ' + ringName(L, ri) + ', а из неё ' + C.dat + ' не попасть в ' + C.acc + ' банку.';
  }
  // 2) подкова заперта: ни с одного конца ничего не уйдёт туда, откуда есть дорога

    const arr = s.rings[ri]; if (!arr.length) continue;
    const outs = L.valves.filter(v => v.from === L.rings[ri].id);

// --- DOM, экраны (§6, §9, §11) ---
const $ = (id) => document.getElementById(id);
function goto(screen, payload){
  G.screen = screen; log('screen', screen);
  const ov = $('overlay'), card = $('card');
  document.body.dataset.screen = screen;
  ov.classList.toggle('win', screen === 'win'); card.className = 'card' + (screen === 'win' ? ' wincard' : '');
  if (screen === 'game'){ ov.classList.remove('show'); return; }
  ov.classList.add('show');
  if (screen === 'menu'){
    const cur = Math.min(G.save.level, LEVELS.length - 1);
    card.innerHTML = `<h1 class="logo">Песок</h1><p>Крути подковы — песок сыплется с нижнего конца прямо вниз.<br>Насыпь каждую банку её цветом.</p>
      <button class="primary big" data-act="play">Играть · уровень ${cur + 1}</button>
      <div class="levels">${LEVELS.map((L, i) => `<button class="lv${G.save.done[i] ? ' done' : ''}${i === cur ? ' cur' : ''}" data-act="lv" data-i="${i}">${i + 1}</button>`).join('')}</div>
      <button data-act="help">Как играть</button> <button data-act="tapmode" id="btn-tapmode">${G.tapMacro ? 'Тап: до пересыпания' : 'Тап: один щелчок'}</button>`;

      <li><b>Крути подкову пальцем</b> — в любую сторону. <b>Тап</b> — ${G.tapMacro ? 'крутит по часовой до ближайшего пересыпания' : 'один щелчок по часовой'}.</li>
      <li>Песок сыплется с <b>нижнего конца</b> прямо вниз: в воронку банки или в подкову ниже.</li>
      <li>Банка берёт <b>только свой цвет</b>. Чужой цвет над воронкой не сыплется.</li>
      <li>Подкова ниже примет песок, если её конец стоит прямо под струёй — у такого конца <b>золотая кромка</b>.</li>
      <li><b>Зажми подкову и подержи</b> — увидишь, куда ляжет песок. Отпустишь — ход не сделается.</li></ul>
      <button class="primary" data-act="menu">Понятно</button>`;
  if (screen === 'win'){
    const p = payload || {}, li = G.s ? G.s.li : 0;

    const w = [...words[li % words.length]];
    const sp = [[-8, -40, 26, 0], [92, -30, 20, 300], [-14, 40, 16, 600], [100, 52, 24, 150], [20, -70, 14, 450], [74, -78, 18, 750], [48, 95, 15, 900]];
    card.innerHTML = `<div class="burst"></div><div class="glow"></div>
      <div class="word" style="font-size:${Math.min(64, Math.floor(Math.min(innerWidth, 420) * 0.86 / (w.length * 0.62)))}px">${w.map((ch, i) => `<span style="animation-delay:${i * 55}ms,${700 + i * 95}ms">${ch}</span>`).join('')}</div>
      ${sp.map(([x, y, f, d]) => `<i class="sp" style="left:${x}%;top:${y}px;width:${f}px;height:${f}px;animation-delay:${d}ms"></i>`).join('')}

  }
}
$('card').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act; Snd.init(); log('input', 'button', act); Snd.tick();
  if (act === 'play') startLevel(Math.min(G.save.level, LEVELS.length - 1));
  else if (act === 'lv') startLevel(+b.dataset.i);
  else if (act === 'retry') startLevel(G.s ? G.s.li : 0);
  else if (act === 'next'){ const li = G.s ? G.s.li + 1 : 0; if (li >= LEVELS.length) goto('menu'); else startLevel(li); }
  else if (act === 'help') goto('help');
  else if (act === 'tapmode'){ G.tapMacro = !G.tapMacro; G.save.tapMacro = G.tapMacro; save(); log('event', 'tapmode', G.tapMacro ? 'macro' : 'click'); goto('menu'); }
  else goto('menu');
});
window.addEventListener('hashchange', () => routeHash());
function routeHash(){
  const h = location.hash.slice(1); if (!h) return false;
  const m = /^(?:level|l)(\d+)$/.exec(h);
  if (m){ startLevel(Math.max(0, Math.min(LEVELS.length - 1, +m[1] - 1))); return true; }
  if (h === 'game'){ startLevel(Math.min(G.save.level, LEVELS.length - 1)); return true; }
  if (h === 'win'){ if (!G.s) startLevel(0); goto('win', { text: 'Эталонный кадр экрана победы', clean: true }); return true; }
  if (['menu', 'help'].includes(h)){ goto(h); return true; }
  return false;
}
let toastUntil = 0;

function hud(){

  $('hud-moves').textContent = '';                 // v0.6.1, П-9: счётчика щелчков на экране нет (на карточке победы цифр тоже нет)
  $('hint').textContent = G.dead ? '' : (L.hint || '');

  G.dead = di.text; G.deadInfo = di; G.queue.length = 0;

// Граф уровня (до ~35 тыс. состояний) считается после первого кадра: не держит ни старт, ни показ уровня. par и тупики — оттуда.
function scheduleAnalyze(){
  if (!G.booted){ G.needAnalyze = true; return; }
  const L = G.s && G.s.L; if (!L) return;
  setTimeout(() => { if (!G.s || G.s.L !== L) return; const t0 = performance.now();
    graphAsync(L, (g) => { if (!G.s || G.s.L !== L) return; const d = g.dist.get(stateKey(createState(G.s.li))); G.par = d === undefined ? -1 : d;
      log('event', 'level.start', 'level=' + (G.s.li + 1) + ' par=' + G.par + ' states=' + g.seen.size + ' dead=' + (g.seen.size - g.good.size) + ' graph=' + Math.round(performance.now() - t0) + 'ms');
      if (!G.pour && !G.ending){ const di = deadInfo(G.s); if (di) showDead(di); } }); }, 80);
}
function startLevel(li){
  G.s = createState(li); G.view = cloneState(G.s); G.pour = null; G.press = null; G.fx = []; G.ending = 0; G.hint = null; G.punch = 0; G.flashBg = 0; G.queue = []; G.deny = null; if (R3) R3.parts = [];
  hideDead();
  // граф уровня (до ~35 тыс. состояний) считается после первого кадра, чтобы не держать показ уровня; par и тупики — оттуда
  G.par = -1; scheduleAnalyze();
  if (R3) buildLevel(G.s.L);
  goto('game'); hud();
  if (li === 0 && !G.save.done[0]) setTimeout(() => { if (G.s && G.s.li === 0 && !G.s.moves){ const m = hintMove(G.s); if (m !== null) G.hint = { m, until: now() + 4000 }; } }, 900);
}

// ===========================================================================
// 3D: рендерер, окружение, материалы. Всё строится кодом из именованных функций (§11), модели Tripo — файлами.
// ===========================================================================
let R3 = null;
const GLB = {};                // id → модель из assets/models (если загрузилась)
const MODEL_IDS = ['lid', 'lock', 'stand'];                // v0.6: вентилей нет — модель valve не грузим

// Шейдеры. Цвета в юниформах — линейные, в конце colorspace_fragment переводит в sRGB.
const SH_VERT = `
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vO = position;
  vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
// Песок дозой в трубке: зерно (хеш-шум по координатам), тёмные швы между дозами, искорки. Доза — дуга 45°, показывается её часть uLo..uHi
// (0 — со стороны E1, 1 — со стороны E0): так доза «вытекает» в клапан и «наползает» в приёмнике. uHi — мигание в превью.
const SH_SAND = `
uniform vec3 uCol; uniform vec3 uLight; uniform float uLo; uniform float uHi; uniform float uBlink; uniform float uTime; uniform float uGhost;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
void main(){
  float f = atan(vO.y, vO.x) / 0.7853982;
  if (f < uLo || f > uHi) discard;
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  vec3 L = normalize(uLight);
  float g = h3(floor(vO * 70.0)), g2 = h3(floor(vO * 31.0) + 7.0);
  float lam = 0.55 + 0.45 * clamp(dot(N, L), 0.0, 1.0);
  float ndv = clamp(dot(N, vV), 0.0, 1.0);
  vec3 c = uCol * lam * (0.82 + 0.3 * g + 0.12 * g2);
  c *= 0.78 + 0.32 * ndv;
  float seam = smoothstep(0.035, 0.0, f - uLo) * step(0.001, 1.0 - uLo) + smoothstep(0.965, 1.0, f) * step(uHi, 0.999) * 0.0;
  float edge = min(f, 1.0 - f); c *= mix(0.72, 1.0, smoothstep(0.0, 0.06, edge));
  c += vec3(1.0) * step(0.985, h3(floor(vO * 90.0) + floor(uTime * 3.0))) * 0.35 * ndv;
  if (uBlink > 0.5) c = mix(c, vec3(1.0), 0.2 + 0.16 * sin(uTime * 10.0));
  float a = 1.0;
  if (uGhost > 0.5){ a = 0.55 + 0.2 * sin(uTime * 8.0); c = mix(uCol, vec3(1.0), 0.25); }
  gl_FragColor = vec4(c, a);
  #include <colorspace_fragment>
}`;
// Песок в банке: срез — горка (конус от края к середине), сверху светлее; выше — отрезано. uGhost — «призрак» прихода.
const SH_HEAP = `
uniform vec3 uCol; uniform vec3 uLight; uniform float uTop; uniform float uHeap; uniform vec2 uC; uniform float uR; uniform float uTime;
uniform float uGhost; uniform float uGhostTop; uniform vec3 uGhostC;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
void main(){
  float r = length(vW.xz - uC) / uR;
  float surf = uTop + uHeap * (1.0 - clamp(r, 0.0, 1.0));
  bool ghost = false;
  if (vW.y > surf){ if (uGhost > 0.5 && vW.y < uGhostTop + uHeap * (1.0 - clamp(r, 0.0, 1.0))) ghost = true; else discard; }
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  vec3 L = normalize(uLight);
  float g = h3(floor(vW * 60.0));
  vec3 c = uCol * (0.6 + 0.4 * clamp(dot(N, L), 0.0, 1.0)) * (0.84 + 0.28 * g);
  if (!gl_FrontFacing) c = uCol * (1.05 + 0.2 * g);
  float top = smoothstep(surf - 0.05, surf, vW.y); c = mix(c, uCol * 1.15 + 0.08, top * 0.6);
  float a = 1.0;
  if (ghost){ a = 0.5 + 0.2 * sin(uTime * 8.0); c = mix(uGhostC, vec3(1.0), 0.3); }
  gl_FragColor = vec4(c, a);
  #include <colorspace_fragment>
}`;
// Стекло: прозрачная основа, френель по краю, два блика. Без второго прохода рендера (дёшево на телефоне).
const SH_GLASS = `
uniform vec3 uTint; uniform vec3 uLight; uniform float uAlpha; uniform float uBack;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
void main(){
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  float ndv = clamp(abs(dot(N, vV)), 0.0, 1.0);
  float fr = pow(1.0 - ndv, 2.4);
  vec3 L = normalize(uLight);
  float sp = pow(max(dot(N, normalize(L + vV)), 0.0), 140.0) * 1.5;
  vec3 Rf = reflect(-vV, N);
  float strip = smoothstep(0.78, 0.9, Rf.y * 0.85 - Rf.x * 0.4);
  float a = uAlpha + fr * 0.6 + sp + strip * 0.45;
  vec3 c = mix(uTint, vec3(1.0), clamp(fr * 0.7 + sp + strip, 0.0, 1.0));
  gl_FragColor = vec4(c, clamp(a, 0.0, 0.95) * (uBack > 0.5 ? 0.45 : 1.0));
  #include <colorspace_fragment>
}`;
// Пунктир дороги: точки бегут вниз от устья к приёмнику (uv.y: 1 — верх). uA — прозрачность (подсветка при касании).
const SH_GUIDE_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const SH_GUIDE = `
uniform vec3 uCol; uniform float uLen; uniform float uTime; uniform float uA; varying vec2 vUv;
void main(){
  float s = (1.0 - vUv.y) * uLen;                       // путь от устья вниз, мировые ед.
  float ph = fract(s / 0.2 - uTime * 2.2);
  vec2 d = vec2((vUv.x - 0.5) * 0.09, (ph - 0.5) * 0.2);
  float dot = smoothstep(0.036, 0.026, length(d));
  float a = dot * uA * smoothstep(0.0, 0.08, s) * smoothstep(0.0, 0.08, uLen - s);
  gl_FragColor = vec4(mix(uCol, vec3(1.0), 0.25), a);
  #include <colorspace_fragment>
}`;
const SH_BG_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
// Фон: вертикальный градиент, мягкое пятно света за полем, редкий узор кружков (как на референсе — сиреневый).
const SH_BG = `
uniform vec3 uTop; uniform vec3 uBot; varying vec2 vUv;
void main(){
  vec3 c = mix(uBot, uTop, smoothstep(0.0, 1.0, vUv.y));
  float glow = 1.0 - smoothstep(0.0, 0.55, distance(vUv, vec2(0.5, 0.58)));
  c += vec3(0.06, 0.05, 0.08) * glow;
  vec2 g = fract(vUv * vec2(9.0, 18.0)) - 0.5; float dots = smoothstep(0.12, 0.09, length(g));
  c += vec3(0.025) * dots;
  gl_FragColor = vec4(c, 1.0);

async function loadModels(){
  let list = MODEL_IDS;
  try { const r = await fetch('assets/models/manifest.json'); if (r.ok) list = ((await r.json()).models || MODEL_IDS).filter(id => MODEL_IDS.includes(id)); } catch (e) {}
  await Promise.all(list.map(async (id) => {
    try { GLB[id] = await loadGLB('assets/models/' + id + '.glb'); log('event', 'glb.loaded', id); } catch (e) { log('event', 'glb.fail', id + ': ' + e.message); }
  }));
  mark('glb');
}

// --- построители деталей (процедурные — с запасным вариантом, если GLB не загрузился) ---
function makeLid(color){                 // крышка банки: модель Tripo, перекрашенная в цвет банки
  let g;
  if (GLB.lid){ g = fitModel(GLB.lid, CFG.JAR_W * 0.86, 'x'); g.traverse(o => { if (o.isMesh){ o.material = o.material.clone(); o.material.map = null; o.material.color = lin(COLORS[color].hex); o.material.metalness = 0.05; o.material.roughness = 0.3; o.material.roughnessMap = null; o.material.metalnessMap = null; } }); }
  else { g = new THREE.Group(); const m = new THREE.Mesh(new THREE.CylinderGeometry(CFG.JAR_W * 0.43, CFG.JAR_W * 0.43, 0.16, 28), new THREE.MeshStandardMaterial({ color: lin(COLORS[color].hex), roughness: 0.35 })); g.add(m); g.userData.size = new THREE.Vector3(CFG.JAR_W * 0.86, 0.16, CFG.JAR_W * 0.86); }
  return g;
}
function makeLock(){                     // золотой замок
  if (GLB.lock) return fitModel(GLB.lock, 0.56, 'y');
  const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.28, 0.12), R3.mat.gold); g.add(body);
  const sh = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.035, 8, 20, Math.PI), R3.mat.gold); sh.position.y = 0.14; g.add(sh); return g;
}
function makeShelf(width){               // полка под банками
  if (GLB.stand){ const g = fitModel(GLB.stand, width, 'x'), k = VIEW.SHELF_H / g.userData.size.y; g.scale.set(1, k, 1.4 * k); g.userData.size.y *= k; return g; }
  const g = new THREE.Group(); const p = new THREE.Mesh(new THREE.BoxGeometry(width, 0.28, 1.1), R3.mat.wood); g.add(p);
  g.userData.size = new THREE.Vector3(width, 0.28, 1.1); return g;
}
// Путь песчинок (точки + накопленная длина).
function polyline(pts){ const P = pts.map(p => new THREE.Vector3(p.x, p.y, p.z || 0)), S = [0]; for (let i = 1; i < P.length; i++) S.push(S[i - 1] + P[i].distanceTo(P[i - 1])); return { P, S, len: S[S.length - 1] }; }
function polyAt(pl, s, out){ s = Math.max(0, Math.min(pl.len, s)); let i = 1; while (i < pl.S.length - 1 && pl.S[i] < s) i++; const k = (s - pl.S[i - 1]) / Math.max(1e-6, pl.S[i] - pl.S[i - 1]); return out.lerpVectors(pl.P[i - 1], pl.P[i], k); }

// --- сборка уровня ---
function disposeLevel(){
  const lv = R3.level; if (!lv) return;
  R3.scene.remove(lv.root);
  lv.root.traverse(o => { if (o.isMesh && o.userData.ownGeo) o.geometry.dispose(); if (o.isMesh && o.userData.ownMat) o.material.dispose(); });
  R3.level = null;
}
// Подкова в локальных координатах (положение o = 0): стекло, две заглушки на концах, 6 доз песка (видны по числу доз в цепочке).
// small — малая подкова: своё стекло (клон того же шейдера, программа общая), плотнее, пока подкова пустая (v0.6.1, П-6).
function makeHorseshoe(ri, small){
  const rot = new THREE.Group(), own = (m) => { m.userData.ownMat = true; return m; };
  const gB = small ? R3.mat.glassBack.clone() : R3.mat.glassBack, gF = small ? R3.mat.glassFront.clone() : R3.mat.glassFront;
  const back = new THREE.Mesh(R3.geo.glass, gB); back.renderOrder = 2; rot.add(back);
  const front = new THREE.Mesh(R3.geo.glass, gF); front.renderOrder = 3; rot.add(front);
  if (small){ back.userData.ownMat = true; front.userData.ownMat = true; }
  const ends = [];
  for (const e of [0, 1]){                          // заглушки: полусфера наружу по касательной; устье — кольцо-кромка на конце
    const deg = endDeg(0, e), p = rimAt({ x: 0, y: 0 }, deg), dir = e ? 1 : -1;      // E0 смотрит против часовой, E1 — по часовой (наружу из дуги)
    const tan = new THREE.Vector3(-Math.cos(deg * DEG), Math.sin(deg * DEG), 0).multiplyScalar(-dir), caps = [];
    for (const [m, ro] of [[gB, 2], [gF, 3]]){ const c = new THREE.Mesh(R3.geo.cap, m); c.position.set(p.x, p.y, 0); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan); c.renderOrder = ro; rot.add(c); caps.push(c); }
    const lip = own(new THREE.Mesh(R3.geo.lip, new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.15, metalness: 0.1, roughness: 0.35 })));
    lip.position.set(p.x, p.y, 0); lip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan); lip.renderOrder = 3; rot.add(lip);
    ends.push({ caps, lip, k: 0, flash: 0 });
  }
  const doses = [];
  for (let i = 0; i < CFG.RING_CAP + 2; i++){ const d = own(new THREE.Mesh(R3.geo.dose, sandMaterial('b'))); d.renderOrder = 1; d.visible = false; rot.add(d); doses.push(d); }
  return { rot, doses, ends, glass: small ? [gB, gF] : null };
}
function buildLevel(L, noWarm){
  if (!R3) return;
  disposeLevel();
  const root = new THREE.Group(), lv = { L, root, rings: [], jars: [], valves: [] };
  const own = (m) => { m.userData.ownMat = true; return m; };
  L.rings.forEach((r, ri) => {
    const g = new THREE.Group(), sc = r.s || 1; g.position.set(r.x, r.y, 0); g.scale.setScalar(sc);      // малая подкова — та же модель в масштабе
    const sh = new THREE.Mesh(R3.geo.plane, R3.mat.ringShadow); sh.scale.setScalar(3.1 * sc); sh.position.set(r.x + 0.22 * sc, r.y - 0.3 * sc, -5.9); sh.renderOrder = -5; root.add(sh);
    // v0.6: точек-щелчков по ободу нет — меньше деталей на поле (комментарий Веры 06.11)
    const hs = makeHorseshoe(ri, (r.s || 1) < 1); g.add(hs.rot);
    // устье: мягкое свечение у выпуска, где сейчас стоит конец (неподвижно, по точкам BL/BR)
    const mouths = {};
    for (const at of ['BL', 'BR']){
      const v = valveAt(L, ri, at), p = rimAt({ x: 0, y: 0 }, SPOT_DEG[at]);
      const m = own(new THREE.Mesh(R3.geo.plane, new THREE.MeshBasicMaterial({ map: radialTexture('soft'), color: v ? dropColor(L, v) : new THREE.Color(1, 1, 1), transparent: true, depthWrite: false, opacity: 0, blending: THREE.AdditiveBlending })));
      m.position.set(p.x, p.y, 0.3); m.scale.setScalar(0.62); m.renderOrder = 0; m.visible = false; g.add(m); mouths[at] = { m, v, k: 0 };
    }
    let lock = null, tag = null;
    if (r.lock){
      lock = makeLock(); lock.position.set(0, 0.04, 0.3); g.add(lock);
      tag = own(new THREE.Mesh(R3.geo.plane, new THREE.MeshBasicMaterial({ map: labelTexture(r.lock), transparent: true, depthTest: false })));
      tag.scale.setScalar(0.32); tag.position.set(0.26, -0.2, 0.5); tag.renderOrder = 6; g.add(tag);
    }
    root.add(g);
    const cont = G.s ? G.s.ang[ri] : r.o, n = (G.view ? G.view.rings[ri] : [...r.fill]).length, p0 = restOffset(cont, n);
    lv.rings.push({ id: r.id, g, rot: hs.rot, doses: hs.doses, ends: hs.ends, mouths, pop: 0, lock, tag, cont, vis: cont, anim: null, shake: 0, unlocked: false, p: p0, pT: p0, slideAt: 0,
      glass: hs.glass, glassA: VIEW.GLASS_A_SMALL, jerk: null });
  });
  // банки на полке, с воронкой цвета банки
  const xs = L.jars.map(j => j.x), minX = Math.min(...xs), maxX = Math.max(...xs);
  const shelf = makeShelf(maxX - minX + CFG.JAR_W + 0.9), ssz = shelf.userData.size || new THREE.Vector3(1, 0.3, 1);
  shelf.position.set((minX + maxX) / 2, CFG.JAR_FLOOR - ssz.y / 2 + VIEW.SHELF_SINK, 0.05); root.add(shelf);
  lv.shelfBottom = CFG.JAR_FLOOR - ssz.y;
  L.jars.forEach((j, ji) => {
    const h = jarHeight(j.cap), r = CFG.JAR_W / 2;
    if (!R3.geo.jar[j.cap]) R3.geo.jar[j.cap] = new THREE.LatheGeometry(jarProfile(h, r), 40);
    if (!R3.geo.jarSand[j.cap]) R3.geo.jarSand[j.cap] = new THREE.LatheGeometry(sandJarProfile(r * 0.82), 36).scale(1, h / 2.0 * 0.92, 1);
    const g = new THREE.Group(); g.position.set(j.x, CFG.JAR_FLOOR, 0);
    const sand = own(new THREE.Mesh(R3.geo.jarSand[j.cap], heapMaterial(j.c, j.x))); sand.renderOrder = 1; g.add(sand);
    const back = new THREE.Mesh(R3.geo.jar[j.cap], R3.mat.glassBack); back.renderOrder = 2; g.add(back);
    const front = new THREE.Mesh(R3.geo.jar[j.cap], R3.mat.glassFront); front.renderOrder = 3; g.add(front);
    for (let k = 1; k < j.cap; k++){         // деления — по дозе
      const t = new THREE.Mesh(R3.geo.plane, R3.mat.line); t.scale.set(0.12, 0.022, 1); t.position.set(-r * 0.62, 0.04 + k * CFG.JAR_DOSE_H, r * 0.9); t.renderOrder = 5; g.add(t);
    }
    const lab = own(new THREE.Mesh(R3.geo.plane, new THREE.MeshBasicMaterial({ map: labelTexture(j.c), transparent: true, depthWrite: false })));
    lab.scale.setScalar(0.34); lab.position.set(0, Math.min(h * 0.42, 0.4), r + 0.02); lab.renderOrder = 5; g.add(lab);
    const funnel = new THREE.Mesh(R3.geo.funnel, funnelMat(j.c)); funnel.position.y = h; funnel.renderOrder = 3; g.add(funnel);
    const lid = makeLid(j.c), lsz = lid.userData.size || new THREE.Vector3(0.8, 0.16, 0.8);
    const lidHome = new THREE.Vector3(0, h + lsz.y * 0.42, 0), lidOpen = new THREE.Vector3(0, h + VIEW.LID_HOVER, 0.1);
    lid.position.copy(lidOpen); lid.visible = false; g.add(lid);
    const blob = new THREE.Mesh(R3.geo.plane, R3.mat.blob); blob.scale.set(1.25, 0.5, 1); blob.rotation.x = -Math.PI / 2; blob.position.set(0, 0.005, 0.1); g.add(blob);
    root.add(g);
    const wave = own(new THREE.Mesh(R3.geo.plane, new THREE.MeshBasicMaterial({ map: radialTexture('halo'), color: lin(COLORS[j.c].hex), transparent: true, depthWrite: false })));
    wave.position.set(j.x, CFG.JAR_FLOOR + h + 0.1, 0.5); wave.visible = false; wave.renderOrder = 5; root.add(wave);
    lv.jars.push({ id: j.id, g, sand, funnel, lid, lidHome, lidOpen, closed: false, h, V: 0, bump: 0, wave, order: 0 });
  });
  // дороги v0.6: жёлобов и вентилей нет — песок падает отвесно. В покое между подковой и приёмником пусто; пока палец на подкове
  // (или подсказка), её дороги видны пунктиром цвета приёмника, а у точки падения — ореол. Струя песка при пересыпании — столбик + песчинки.
  L.valves.forEach((v, vi) => {
    const P = valvePath(L, v), col = dropColor(L, v), toJar = !!jarById(L, v.to), len = P[0].y - P[1].y;
    const guide = own(new THREE.Mesh(R3.geo.plane, new THREE.ShaderMaterial({ vertexShader: SH_GUIDE_VERT, fragmentShader: SH_GUIDE + COLD, transparent: true, depthWrite: false,
      uniforms: { uCol: { value: col.clone() }, uLen: { value: len }, uTime: { value: 0 }, uA: { value: 0 } } })));
    guide.userData.ownGeo = false; guide.scale.set(VIEW.GUIDE_W, len, 1); guide.position.set(P[0].x, (P[0].y + P[1].y) / 2, 0.25); guide.renderOrder = 4; guide.visible = false; root.add(guide);
    const eg = own(new THREE.Mesh(R3.geo.plane, new THREE.MeshBasicMaterial({ map: radialTexture('halo'), color: col.clone(), transparent: true, depthWrite: false })));
    const endS = toJar ? 1.1 : 0.7; eg.scale.setScalar(endS); eg.position.set(P[1].x, P[1].y + (toJar ? 0.02 : 0), 0.35); eg.renderOrder = 4; eg.visible = false; root.add(eg);
    lv.valves.push({ id: v.id, v, guide, endGlow: eg, endS, P, len, glow: 0, col: col.clone() });
  });
  // струя песка: столбик цвета песка от устья вниз, голова и хвост бегут с ускорением (как песчинки)
  const stream = new THREE.Mesh(R3.geo.stream, R3.mat.stream); stream.visible = false; stream.renderOrder = 3; root.add(stream); lv.stream = stream;
  R3.scene.add(root); R3.level = lv;
  // призрак следующего щелчка: контур подковы, ореол над устьем, крестик «не пройдёт»
  const ghost = new THREE.Mesh(R3.geo.ghost, R3.mat.ghost); ghost.visible = false; ghost.renderOrder = 5; root.add(ghost);
  const halo = new THREE.Mesh(R3.geo.plane, R3.mat.halo); halo.visible = false; halo.renderOrder = 4; root.add(halo);
  const cross = new THREE.Mesh(R3.geo.plane, R3.mat.cross); cross.scale.setScalar(0.34); cross.visible = false; cross.renderOrder = 7; root.add(cross);
  // v0.6.1: стрелка подсказки (П-3), крестик над банкой при тупике (П-2) и в превью урока 3-го (П-7)
  const hintArrow = new THREE.Mesh(R3.geo.plane, R3.mat.hintArrow); hintArrow.visible = false; hintArrow.renderOrder = 11; root.add(hintArrow);
  const deadCross = new THREE.Mesh(R3.geo.plane, R3.mat.cross); deadCross.visible = false; deadCross.renderOrder = 8; root.add(deadCross);
  const warnCross = new THREE.Mesh(R3.geo.plane, R3.mat.cross); warnCross.visible = false; warnCross.renderOrder = 8; root.add(warnCross);
  Object.assign(lv, { ghost, halo, cross, hintArrow, deadCross, warnCross });
  // кадр по полю: подковы, банки
  let x0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of L.rings){ const e = ringR(r) + tubeR(r) + 0.15; x0 = Math.min(x0, r.x - e); x1 = Math.max(x1, r.x + e); y1 = Math.max(y1, r.y + e); }
  for (const j of L.jars){ x0 = Math.min(x0, j.x - CFG.JAR_W / 2 - 0.3); x1 = Math.max(x1, j.x + CFG.JAR_W / 2 + 0.3); }
  const padW = Math.max(0, VIEW.MIN_W - (x1 - x0)) / 2;
  lv.box = { x0: x0 - VIEW.MARGIN_X - padW, x1: x1 + VIEW.MARGIN_X + padW, y0: lv.shelfBottom - 0.2, y1: y1 + VIEW.MARGIN_TOP + 0.5 };
  frameCamera();
  syncView(now());
  if (!noWarm) warmUp();
  log('event', 'level.built', 'rings=' + L.rings.length + ' jars=' + L.jars.length + ' drops=' + L.valves.length);
}
function frameCamera(){
  if (!R3 || !R3.level) return;
  const b = R3.level.box, cam = R3.camera, w = b.x1 - b.x0, h = b.y1 - b.y0, cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const t = Math.tan(THREE.MathUtils.degToRad(VIEW.FOV / 2)), dist = Math.max(h / 2 / t, w / 2 / (t * cam.aspect)) + 0.6;
  const hv = 2 * t * (dist - 0.6), cyy = hv > h ? b.y0 + hv / 2 - 0.15 : cy;
  cam.position.set(cx, cyy + Math.sin(VIEW.TILT) * dist, Math.cos(VIEW.TILT) * dist); cam.lookAt(cx, cyy, 0); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  const bgH = 2 * Math.tan(THREE.MathUtils.degToRad(VIEW.FOV / 2)) * (dist + 6) * 1.15;
  R3.bg.scale.set(bgH * cam.aspect * 1.2, bgH, 1); R3.bg.position.set(cx, cyy, -6);
}
// Прогрев: один раз нарисовать то, что появится позже (дозы, призрак, крестик, ореол, песчинки), потом скрыть.
function warmUp(){
  const lv = R3.level; if (!lv) return;
  const show = [lv.ghost, lv.halo, lv.cross, lv.hintArrow, lv.deadCross, lv.warnCross, lv.stream, ...lv.rings.flatMap(R => R.doses.concat(Object.values(R.mouths).map(M => M.m))), ...lv.jars.map(J => J.lid), ...lv.jars.map(J => J.wave), ...lv.valves.flatMap(V => [V.guide, V.endGlow])];
  const was = show.map(o => o.visible);
  show.forEach(o => { o.visible = true; });
  R3.grains.count = 1; R3.drops.count = 1; R3.conf.count = 1; R3.stars.count = 1;
  R3.renderer.render(R3.scene, R3.camera);
  show.forEach((o, i) => { o.visible = was[i]; });
  R3.grains.count = 0; R3.drops.count = 0; R3.conf.count = 0; R3.stars.count = 0;
}

// --- отображение: углы подков, цепочки песка по «видимому» состоянию + текущему пересыпанию ---
// Доза рисуется дугой 45°: позиция pos (ячейка от E0, дробная) → поворот; lo..hi — видимая часть (0 — сторона E1, 1 — сторона E0).
function placeDose(mesh, c, pos, lo, hi, time){
  const u = mesh.material.uniforms;
  if (hi - lo < 0.002){ mesh.visible = false; return; }
  mesh.visible = true; mesh.rotation.z = -(112.5 + 45 * pos) * DEG;
  if (mesh.userData.c !== c){ u.uCol.value.set(COLORS[c].hex); mesh.userData.c = c; }
  u.uLo.value = lo; u.uHi.value = hi; u.uTime.value = time; u.uBlink.value = 0; u.uGhost.value = 0;
}
// Угол подковы на экране (в щелчках, непрерывно): за пальцем при драге, с отскоком после тапа, с дрожью у запертой.
function updateRings(tNow){
  const lv = R3.level, ts = G.timeScale, P = G.press;
  lv.rings.forEach((R, ri) => {
    let base = R.cont;
    if (R.anim){ const k = (tNow - R.anim.t0) / (R.anim.ms / ts); if (k >= 1) R.anim = null; else base = R.anim.from + (R.anim.to - R.anim.from) * (R.anim.back ? ease.back(Math.max(0, k)) : ease.out(Math.max(0, k))); }
    let off = 0;
    if (P && P.ri === ri && P.drag){ off = P.acc / STEP; off = G.pour ? Math.max(-0.12, Math.min(0.12, off)) : Math.max(-0.62, Math.min(0.62, off)); }
    if (R.shake){ const k = (tNow - R.shake) / (360 / ts); if (k >= 1) R.shake = 0; else off += 0.07 * Math.sin(k * Math.PI * 6) * (1 - k); }
    if (G.spinDemo) off += (tNow - G.spinDemo) / 1000 * 1.6 * (ri % 2 ? -1 : 1);
    R.vis = base + off;
    R.rot.rotation.z = -R.vis * STEP;
    if (R.pop){ const k = (tNow - R.pop) / (200 / ts); if (k >= 1){ R.pop = 0; R.rot.scale.setScalar(1); } else R.rot.scale.setScalar(1 + 0.04 * Math.sin(k * Math.PI) * (1 - k * 0.5)); }
  });
}
let lastSync = 0;
function syncView(tNow){
  const lv = R3 && R3.level; if (!lv || !G.view) return;
  const P = G.pour, L = G.view.L, time = tNow / 1000, dt = Math.min(0.1, Math.max(0, (tNow - (lastSync || tNow)) / 1000)) * G.timeScale; lastSync = tNow;
  let t = 0;
  if (P) t = Math.max(0, Math.min(P.info.amount, (tNow - P.tA) / (CFG.POUR_MS / G.timeScale)));
  updateRings(tNow);
  const cap = CFG.RING_CAP;
  lv.rings.forEach((R, ri) => {
    const arr = G.view.rings[ri];
    // цепочка съезжает к нижней точке (ядро: сыплется всегда с нижнего конца; здесь — только картинка)
    if (!(P && (P.info.src === ri || P.info.ti === ri))){ const o = posNorm(Math.round(R.vis)); const pt = restOffset(o, arr.length, R.pT); if (pt !== R.pT){ R.pT = pt; if (tNow - R.slideAt > 250 && arr.length){ Snd.slide(); R.slideAt = tNow; } } }
    const d = R.pT - R.p, mv = VIEW.SLIDE_SPEED * dt; R.p = Math.abs(d) <= mv ? R.pT : R.p + Math.sign(d) * mv;
    let k = 0;
    const put = (c, pos, lo, hi) => { if (k < R.doses.length) placeDose(R.doses[k++], c, pos, lo, hi, time); };
    if (P && P.info.src === ri){
      arr.forEach((c, j) => {
        if (P.info.srcEnd === 0){ const pos = R.p + j - t; put(c, pos, 0, Math.max(0, Math.min(1, 1 + pos))); }
        else { const pos = R.p + j + t; put(c, pos, Math.max(0, Math.min(1, pos + 1 - cap)), 1); }
      });
    } else {
      let jo = 0;                                        // П-5: отказ — песок у устья «дёргается» к выпуску и обратно
      if (R.jerk){ const q = (tNow - R.jerk.t0) / (260 / G.timeScale); if (q >= 1) R.jerk = null; else if (q > 0) jo = (R.jerk.e ? 1 : -1) * 0.2 * Math.sin(q * Math.PI); }
      arr.forEach((c, j) => put(c, R.p + j + jo, 0, 1));
    }
    if (R.glass){ const a = arr.length || (P && P.info.ti === ri) ? VIEW.GLASS_A : VIEW.GLASS_A_SMALL; R.glassA += (a - R.glassA) * Math.min(1, dt * 8); R.glass.forEach(m => { m.uniforms.uAlpha.value = R.glassA; }); }

function pointerAngle(P, e){ const rect = cv.getBoundingClientRect(); return Math.atan2(e.clientY - rect.top - P.cy, e.clientX - rect.left - P.cx); }

  Snd.init(); if (G.screen !== 'game' || !G.s || G.ending || G.press) return;
  const ri = pickRing(e.clientX, e.clientY);
  if (ri < 0){ log('input', 'miss'); return; }
  if (ringLocked(G.s, ri)){ log('input', 'press', 'ring=' + G.s.L.rings[ri].id + ' locked'); const info = moveInfo(G.s, moveOf(ri, 1)); Snd.deny(); buzz(15); toast(denyText(info)); R3.level.rings[ri].shake = now(); return; }
  const s = ringScreen(ri);
  G.press = { ri, id: e.pointerId, x: e.clientX, y: e.clientY, cx: s.x, cy: s.y, rpx: s.rpx, a: 0, acc: 0, drag: false, dir: 0, clicks: 0, ts: e.timeStamp, at: now(), looked: false };
  G.press.a = pointerAngle(G.press, e);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  G.hint = null;
  log('input', 'press', 'ring=' + G.s.L.rings[ri].id);
});
cv.addEventListener('pointermove', (e) => {
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  const rect = cv.getBoundingClientRect(), dx = e.clientX - rect.left - P.cx, dy = e.clientY - rect.top - P.cy;
  if (!P.drag && Math.hypot(e.clientX - P.x, e.clientY - P.y) > VIEW.TAP_PX){ P.drag = true; log('input', 'drag', 'ring=' + G.s.L.rings[P.ri].id); }
  const a = pointerAngle(P, e);
  if (Math.hypot(dx, dy) < P.rpx * 0.3){ P.a = a; return; }             // у центра угол пляшет — не крутим
  let d = a - P.a; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; P.a = a;
  if (!P.drag) return;
  P.acc += d;
  if (Math.abs(d) > 0.004) P.dir = d > 0 ? 1 : -1;            // превью — по направлению движения пальца
  while (!G.pour && !G.ending && Math.abs(P.acc) >= STEP * 0.5){
    const dir = P.acc > 0 ? 1 : -1;
    P.acc -= dir * STEP; P.clicks++;
    if (!turnRing(P.ri, dir, 'drag')) { P.acc = 0; break; }
  }
  if (G.pour) P.acc = Math.max(-STEP * 0.3, Math.min(STEP * 0.3, P.acc));
});
function onUp(e){
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  G.press = null;
  const R = R3 && R3.level && R3.level.rings[P.ri];
  if (R && P.drag){ R.anim = { from: R.vis, to: R.cont, t0: now(), ms: 140, back: false }; }
  if (e.type === 'pointercancel' || P.drag || P.clicks) return;
  const held = e.timeStamp - P.ts;
  if (held >= VIEW.HOLD_LOOK_MS){ log('input', 'look', 'ring=' + G.s.L.rings[P.ri].id + ' held=' + Math.round(held) + 'ms'); return; }
  tapRing(P.ri, 'tap');
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {            // дубли на клавиатуру для отладки (§3): цифра — по часовой, Shift+цифра — против
  const mm = /^Digit([1-9])$/.exec(e.code);
  if (mm && G.s){ if (e.shiftKey) turnRing(+mm[1] - 1, -1, 'key'); else tapRing(+mm[1] - 1, 'key'); }
  if (e.key === 'z' || e.key === 'u') undo(); if (e.key === 'r' && G.s) startLevel(G.s.li); if (e.key === 'm') goto('menu'); if (e.key === 'h') showHint();
});
$('btn-undo').onclick = () => { Snd.init(); log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { Snd.init(); log('input', 'button', 'reset'); if (G.s) startLevel(G.s.li); };
$('btn-hint').onclick = () => { Snd.init(); log('input', 'button', 'hint'); if (G.s && !G.pour) showHint(); };
$('btn-menu').onclick = () => { Snd.init(); log('input', 'button', 'menu'); goto('menu'); };
$('btn-mute').onclick = () => { Snd.init(); G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };
$('dead-undo').onclick = () => { Snd.init(); log('input', 'button', 'dead.undo'); undo(); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
let lastW = 0, lastH = 0;
function fit(){
  if (!R3) return;
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  if (r.width === lastW && r.height === lastH) return; lastW = r.width; lastH = r.height;
  R3.renderer.setPixelRatio(R3.dpr); R3.renderer.setSize(r.width, r.height, false);
  R3.camera.aspect = r.width / r.height; frameCamera();
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// --- кадр ---
function renderFrame(){
  if (!R3) return;
  const tNow = now(), t0 = performance.now();
  if (R3.level && G.view){
    updatePour(tNow);
    drainQueue(tNow);
    const P = G.press;
    if (P && !P.drag && !P.clicks && !P.looked && tNow - P.at >= VIEW.HOLD_LOOK_MS){ P.looked = true; buzz(4); log('input', 'hold', 'ring=' + G.s.L.rings[P.ri].id); }   // дальше отпускание — без хода
    syncView(tNow);
    updateFx(tNow);
    updateParts(tNow);
    const F = window.KLAPANY && window.KLAPANY.flags;
    if (F && F.noParts){ R3.grains.count = 0; R3.drops.count = 0; R3.conf.count = 0; R3.stars.count = 0; }
    applyPunch(tNow);
  }
  updatePic(tNow);
  R3.renderer.render(R3.scene, R3.camera);
  const dt = performance.now() - t0;
  R3.frames.push(dt); if (R3.frames.length > 240) R3.frames.shift();
  if (G.ending && tNow >= G.ending){
    G.ending = 0; const clean = G.par > 0 && G.s.moves <= G.par;
    goto('win', { clean, last: G.s.li >= LEVELS.length - 1 });
  }
  if (toastUntil && tNow > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}
// Подсказка картинкой на уровнях с pic: палец на подкове A — 'tap' тапает (круг-волна), 'drag' ведёт её низ слева направо
// (против часовой) по пунктирной дуге со стрелкой. Пропадает после первого щелчка уровня.
function updatePic(tNow){
  const el = $('pic'), L = G.s && G.s.L, on = !!(L && L.pic && G.screen === 'game' && !G.s.moves && !G.press && !G.pour && R3 && R3.level);
  el.classList.toggle('show', on); if (!on) return;
  const sc = ringScreen(0), t = (tNow / 1000) % 1.6, hand = $('pic-hand'), ring = $('pic-ring'), arc = $('pic-arc'), head = $('pic-head');
  if (L.pic === 'tap'){
    const k = Math.min(1, t / 0.5), press = t < 0.25 ? 0 : t < 0.45 ? 1 : 0;
    hand.setAttribute('transform', `translate(${sc.x + sc.rpx * 0.15},${sc.y + sc.rpx * 0.35 + 26}) scale(${press ? 0.9 : 1})`);
    ring.setAttribute('cx', sc.x + sc.rpx * 0.15); ring.setAttribute('cy', sc.y + sc.rpx * 0.35); ring.setAttribute('r', t > 0.3 ? 10 + 40 * Math.min(1, (t - 0.3) / 0.6) : 0);
    ring.setAttribute('opacity', t > 0.3 ? Math.max(0, 1 - (t - 0.3) / 0.6) : 0); arc.setAttribute('d', ''); head.setAttribute('d', '');
  } else {
    const R = sc.rpx * 1.32, a0 = 150 * DEG, a1 = 30 * DEG, pt = (a) => [sc.x + R * Math.cos(a), sc.y + R * Math.sin(a)];
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    arc.setAttribute('d', `M${x0} ${y0} A${R} ${R} 0 0 0 ${x1} ${y1}`);
    const dx = Math.sin(a1), dy = -Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);    // касательная по ходу (угол убывает) и нормаль
    head.setAttribute('d', `M${x1 + dx * 8} ${y1 + dy * 8} L${x1 - dx * 10 + nx * 10} ${y1 - dy * 10 + ny * 10} L${x1 - dx * 10 - nx * 10} ${y1 - dy * 10 - ny * 10} Z`);
    const k = ease.inOut(Math.min(1, t / 1.2)), a = a0 + (a1 - a0) * k, [hx, hy] = pt(a);
    hand.setAttribute('transform', `translate(${hx},${hy + 26})`); ring.setAttribute('r', 0);
  }
}
// Победа: камера чуть «толкается» вперёд, фон вспыхивает тёплым светом и гаснет.
const _dir = new THREE.Vector3(), _bgTop = new THREE.Color(), _bgBot = new THREE.Color(), _warm = new THREE.Color('#fff1c4');
function applyPunch(tNow){
  if (G.punch){ const k = (tNow - G.punch) / (650 / G.timeScale); frameCamera();
    if (k >= 1) G.punch = 0; else { R3.camera.getWorldDirection(_dir); R3.camera.position.addScaledVector(_dir, 0.55 * Math.sin(Math.min(1, k * 1.6) * Math.PI) * (1 - k)); } }
  const u = R3.bg.material.uniforms;
  if (G.flashBg){ const k = (tNow - G.flashBg) / (700 / G.timeScale), f = k >= 1 ? 0 : 0.55 * Math.pow(1 - k, 2);
    u.uTop.value.copy(_bgTop.copy(lin(VIEW.BG_TOP)).lerp(_warm, f)); u.uBot.value.copy(_bgBot.copy(lin(VIEW.BG_BOTTOM)).lerp(_warm, f * 0.7)); if (k >= 1) G.flashBg = 0; }
}
// rAF + watchdog setInterval: безопасно, потому что время абсолютное (§4)
let lastFrame = 0;
function spinning(){ const lv = R3 && R3.level; return !!(lv && (G.spinDemo || (G.press && G.press.drag) || lv.rings.some(R => R.anim || R.p !== R.pT))); }
function frame(ts){
  const t = performance.now();
  if (G.bench && lastFrame){ if (G.ending || G.screen === 'win') G.bench.win.push(t - lastFrame); else if (G.pour) G.bench.pour.push(t - lastFrame); else if (spinning()) G.bench.spin.push(t - lastFrame); }
  lastFrame = t; if (!G.paused) renderFrame(); requestAnimationFrame(frame);
}
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) renderFrame(); }, 40);

// --- дебаг-хук (§6) ---
const waitFrames = () => new Promise(res => requestAnimationFrame(res));
function benchStats(ints){
  ints = ints.slice().sort((a, b) => a - b); const avg = ints.reduce((a, b) => a + b, 0) / Math.max(1, ints.length);
  return { frames: ints.length, fps: +(1000 / Math.max(1e-6, avg)).toFixed(1), p95ms: +(ints[Math.floor(ints.length * 0.95)] || 0).toFixed(1), long: ints.filter(x => x > 25).length };
}
window.KLAPANY = {
  G, LEVELS, PERF, get R3(){ return R3; },
  state(){ return G.s ? { level: G.s.li + 1, name: G.s.L.name, rings: G.s.rings.map(r => r.join('') || '·').join(' '), ang: G.s.ang.join(''), jars: G.s.jars.join('/'), moves: G.s.moves, par: G.par,
    win: isWin(G.s), dead: G.dead, deadColor: G.deadInfo ? G.deadInfo.color : null, pouring: !!G.pour, queue: G.queue.length, tap: G.tapMacro ? 'macro' : 'click',
    hint: G.hint && now() < G.hint.until ? ((G.hint.m & 1) ? 'ccw ' : 'cw ') + G.s.L.rings[G.hint.m >> 1].id + (G.hint.auto ? ' auto' : '') : '', screen: G.screen } : { screen: G.screen }; },
  play(n){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1)); return this.state(); },
  turn(ri, dir){ turnRing(ri, dir || 1, 'key'); return this.state(); },
  tap(ri){ tapRing(ri, 'tap'); return this.state(); },
  // press/release — как палец: превью с HOLD_SHOW_MS; release() после HOLD_LOOK_MS хода не делает (П-1). at — сдвинуть начало нажатия назад, мс.
  press(ri, dir, ago){ G.press = { ri, id: -1, x: 0, y: 0, cx: 0, cy: 0, rpx: 1, a: 0, acc: 0, drag: false, dir: dir || 0, clicks: 0, ts: 0, at: now() - (ago === undefined ? VIEW.HOLD_SHOW_MS : ago), looked: false }; return moveInfo(G.s, moveOf(ri, dir || 1)); },
  release(){ const P = G.press; G.press = null; if (!P || now() - P.at >= VIEW.HOLD_LOOK_MS) return false; return (P.dir || 1) < 0 ? turnRing(P.ri, -1, 'tap') : tapRing(P.ri, 'tap'); },
  tapMode(macro){ if (macro !== undefined){ G.tapMacro = !!macro; } return G.tapMacro ? 'macro' : 'click'; },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(){ return G.s ? solve(G.s) : null; },
  hint(){ showHint(); return G.hint; },
  auto(delayMs){ const path = this.solve() || []; path.forEach((m, k) => setTimeout(() => turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto'), (delayMs || 1400) * k)); return path; },
  drive(sec, stepMs){                         // ручной прогон времени: rAF заморожен в скрытой вкладке/превью
    const step = stepMs || 1000 / 60, n = Math.round(sec * 1000 / step);
    for (let i = 0; i < n; i++){ T.off += step; renderFrame(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  rings(){ return G.s ? G.s.L.rings.map((r, ri) => ({ ri, id: r.id, o: G.s.ang[ri], locked: ringLocked(G.s, ri), screen: R3 && R3.level ? ringScreen(ri) : null, cw: moveInfo(G.s, moveOf(ri, 1)).code, ccw: moveInfo(G.s, moveOf(ri, -1)).code })) : []; },
  // замер кадра: прогоняет решение текущего уровня на реальном rAF; интервалы кадров отдельно — во время пересыпаний и во время кручения
  async bench(rounds){
    rounds = rounds || 2; const li = G.s ? G.s.li : 2, cpu = []; G.bench = { pour: [], spin: [], win: [] };
    for (let r = 0; r < rounds; r++){
      startLevel(li); await new Promise(res => setTimeout(res, 300));
      for (const m of (solve(G.s) || [])){
        R3.frames.length = 0; turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto');
        while (G.pour || spinning()) await waitFrames();
        cpu.push(...R3.frames);
        await new Promise(res => setTimeout(res, 60));
      }
    }
    for (const t0 = performance.now(); performance.now() - t0 < 3500;) await waitFrames();     // праздник и карточка победы — отдельной корзиной
    startLevel(li); await new Promise(res => setTimeout(res, 300));
    G.spinDemo = now(); for (const t0 = performance.now(); performance.now() - t0 < 2000;) await waitFrames(); G.spinDemo = 0;
    const B = G.bench; G.bench = null; cpu.sort((a, b) => a - b);
    const out = { pour: benchStats(B.pour), spin: benchStats(B.spin), win: benchStats(B.win), cpuAvgMs: +(cpu.reduce((a, b) => a + b, 0) / Math.max(1, cpu.length)).toFixed(2),
      cpuP95ms: +(cpu[Math.floor(cpu.length * 0.95)] || 0).toFixed(2), dpr: R3.dpr, size: R3.renderer.domElement.width + '×' + R3.renderer.domElement.height };
    log('event', 'bench', JSON.stringify(out)); return out;
  },
  startup(){ return PERF; },
  get R3(){ return R3; },
  flags: {},                                   // замер по частям: noParts — выключить частицы и сравнить кадр
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт: меню сразу (DOM), GL и модели — следом; холст проявляется, когда шейдеры собраны и прогреты ---
hud();
if (!routeHash()) goto('menu');
mark('menu');
(async function boot(){
  try {
    await new Promise(r => setTimeout(r, 0));
    initRenderer();
    lastW = 0; fit();
    await Promise.race([loadModels(), new Promise(r => setTimeout(r, 6000))]);
    if (!G.s) { G.s = createState(Math.min(G.save.level, LEVELS.length - 1)); G.view = cloneState(G.s); G.par = -1; G.needAnalyze = true; }
    buildLevel(G.s.L, true); mark('level');
    if (R3.renderer.compileAsync) await R3.renderer.compileAsync(R3.scene, R3.camera); mark('compile');
    warmUp(); renderFrame(); mark('firstFrame');
    $('gl').classList.add('ready'); hud();
    requestAnimationFrame(frame);
    G.booted = true; if (G.needAnalyze){ G.needAnalyze = false; scheduleAnalyze(); }
    log('event', 'boot', 'levels=' + LEVELS.length + ' glb=' + Object.keys(GLB).join(','));
  } catch (err) { console.error(err); log('event', 'boot.fail', err.message); toast('3D не запустился: ' + err.message, 6000); }
})();
}
</script>
