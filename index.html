/* Палитра — одно место (PROTO-BASE §9). Сиреневый фон как на референсе; 3D-фон рисует шейдер теми же цветами (VIEW.BG_*). */
:root{
  --bg:#2a2140; --frame:#9d86f0; --ink:#ffffff; --ink2:#3a2a7a; --muted:#e6defe;
  --panel:#6b4fd8; --panel2:#5a3fc4; --accent:#ffd23a; --accent-ink:#4a2a00; --danger:#ff4d6d; --card:#fbf8ff;
  --frame-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 "Nunito", system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(#c9b8ff,#8b72e8);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
header .title{display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 0 rgba(60,30,140,.35)}
header .title b{font-size:20px;font-weight:900;letter-spacing:.2px} header .title span{font-size:13px;color:var(--muted)}
header button{pointer-events:auto}
.ico{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);box-shadow:0 4px 0 var(--panel2);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico.off .wave{display:none} .ico:not(.off) .slash{display:none}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 66px);z-index:2;text-align:center;font-size:15px;color:#fff;padding:0 24px;pointer-events:none;
  text-shadow:0 2px 0 rgba(60,30,140,.35)}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s}
#game canvas.ready{opacity:1}
footer{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(107,79,216,0),rgba(90,63,196,.35))}
footer button{flex:1;max-width:120px;height:56px;border:0;border-radius:16px;background:var(--panel);box-shadow:0 5px 0 var(--panel2);color:#fff;font:inherit;font-weight:800;font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
footer button svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
footer button:disabled{opacity:.5}
footer button.pulse{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 #d79c00;animation:pulse 1s ease-in-out infinite}
footer button.pulse svg{stroke:var(--accent-ink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
button:active{transform:translateY(2px)}
#dead{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px);z-index:4;display:none;background:rgba(255,255,255,.96);color:var(--ink2);border-radius:18px;
  padding:12px 14px;box-shadow:0 8px 24px rgba(40,10,110,.35);font-size:15px;line-height:1.3}
#dead.show{display:flex;gap:10px;align-items:center}
#dead b{color:var(--danger);display:block;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
#dead button{flex:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:900;padding:10px 12px;box-shadow:0 4px 0 #d79c00;cursor:pointer}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(48,24,120,.45);padding:20px}
#overlay.show{display:flex}
.card{background:var(--card);color:var(--ink2);border-radius:26px;padding:24px 20px;max-width:350px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(30,10,90,.4);
  animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}  /* стартует с видимого состояния (§9) */
.card h1.logo{margin:0 0 6px;font-size:44px;font-weight:1000;color:#fff;-webkit-text-stroke:2px var(--ink2);text-shadow:0 4px 0 var(--ink2)}
.card h2{margin:0 0 8px;font-size:30px;font-weight:1000} .card p{color:#6a5aa8;margin:0 0 16px;font-weight:700}
.card button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:12px 16px;background:#ece6ff;color:var(--ink2);cursor:pointer;margin:4px}
.card button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #d79c00}
.card button.big{font-size:20px;padding:14px 22px;width:100%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.levels .lv{margin:0;padding:12px 0;font-size:18px}
.levels .lv.done{background:#c8f5d4;color:#1f6b38} .levels .lv.cur{outline:3px solid var(--panel)}
.rules{text-align:left;padding-left:18px;margin:0 0 14px;color:#4b3b8c;font-weight:700} .rules li{margin:6px 0}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:4;background:rgba(40,20,100,.88);color:#fff;padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;max-width:86%;text-align:center;font-size:15px}
#toast.hide{opacity:0}
/* карточка победы: без цифр — слово, лучи, искры, одна кнопка. Кейфреймы стартуют с видимого состояния (§9) */
#overlay.win{background:radial-gradient(90% 60% at 50% 34%, rgba(255,236,170,.42), rgba(52,26,128,.40) 78%)}
.card.wincard{background:none;box-shadow:none;padding:0;position:relative;overflow:visible;margin-top:-30vh;animation:none;color:#fff}
.wincard .burst{position:absolute;left:50%;top:34px;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,245,200,.55) 0deg 8deg, rgba(255,245,200,0) 8deg 20deg);
  -webkit-mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.8) 22%, transparent 64%); mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.8) 22%, transparent 64%);
  animation:wspin 16s linear infinite, wburst .7s cubic-bezier(.2,1.5,.4,1) both}
.wincard .glow{position:absolute;left:50%;top:34px;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,251,225,.95), rgba(255,222,120,.4) 42%, rgba(255,222,120,0) 70%);animation:wbreath 1.8s ease-in-out infinite}
.wincard .word{position:relative;font-size:clamp(46px,15vw,66px);font-weight:1000;line-height:1.05;white-space:nowrap;color:#ffe15a;
  -webkit-text-stroke:3px #3b1b8f;paint-order:stroke fill;text-shadow:0 6px 0 #3b1b8f,0 14px 28px rgba(40,10,110,.45)}
.wincard .word span{display:inline-block;animation:wletter .6s cubic-bezier(.2,1.8,.35,1) both, wbob 1.9s ease-in-out infinite}
.wincard .sp{position:absolute;display:block;pointer-events:none;animation:wtw 1.5s ease-in-out infinite;background:radial-gradient(circle,#fff 0 22%,#ffe98a 48%,#ffc928 75%);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}   /* звёздочка без глифа: ✦ нет в Nunito, поиск запасного шрифта стоил кадр в 1 с */
.wincard button.go{position:relative;margin-top:40px;width:auto;min-width:230px;font-size:24px;padding:16px 36px;border-radius:22px;overflow:hidden;
  box-shadow:0 6px 0 #d79c00,0 10px 30px rgba(255,200,40,.5);animation:wgo .5s .45s cubic-bezier(.2,1.7,.4,1) both, pulse 1.3s 1.3s ease-in-out infinite}
.wincard button.go::after{content:'';position:absolute;top:0;bottom:0;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);animation:wshine 2.4s 1.1s ease-in-out infinite}
@keyframes wspin{to{rotate:360deg}}
@keyframes wburst{from{scale:.3}to{scale:1}}
@keyframes wbreath{50%{scale:1.14}}
@keyframes wletter{from{transform:translateY(-38px) scale(.4) rotate(-16deg)}to{transform:none}}
@keyframes wbob{50%{translate:0 -6px}}
@keyframes wtw{0%,100%{scale:.55;rotate:0deg}50%{scale:1.2;rotate:35deg}}
@keyframes wgo{from{scale:.55}to{scale:1}}
@keyframes wshine{0%{left:-70%}55%,100%{left:135%}}
@media (prefers-reduced-motion: reduce){ .wincard *, .wincard *::after{animation:none!important} }
@media (prefers-reduced-motion: reduce){ .card{animation:none} #toast{transition:none} footer button.pulse{animation:none} }
</style>

// ---- геометрия (общая для рендера и проверки раскладки) ----
function ringById(L, id){ return L.rings.find(r => r.id === id); }
function jarById(L, id){ return L.jars.find(j => j.id === id); }
function ringIndex(L, id){ return L.rings.findIndex(r => r.id === id); }
function jarIndex(L, id){ return L.jars.findIndex(j => j.id === id); }
function jarHeight(cap){ return cap * CFG.JAR_DOSE_H + 0.3; }
function funnelTop(J){ return CFG.JAR_FLOOR + jarHeight(J.cap) + CFG.FUNNEL_H; }
function posNorm(k){ return ((k % CFG.POS) + CFG.POS) % CFG.POS; }
function ringCap(L, ri){ return L.rings[ri].cap || CFG.RING_CAP; }
const DEG = Math.PI / 180;
// Точка на осевой линии подковы под углом θ (градусы от дна по часовой).
function rimAt(r, deg){ return { x: r.x - CFG.RING_R * Math.sin(deg * DEG), y: r.y - CFG.RING_R * Math.cos(deg * DEG) }; }
function spotPos(r, spot){ return rimAt(r, SPOT_DEG[spot]); }
// Угол конца e подковы в положении o.
function endDeg(o, e){ return -22.5 + 45 * o + (e ? 270 : 0); }
// Клапаны уровня: что на выпуске, что на входе.
function valveAt(L, ri, spot){ const id = L.rings[ri].id; return L.valves.find(v => v.from === id && v.at === spot) || null; }
function inletValve(L, ri, spot){ const id = L.rings[ri].id; return L.valves.find(v => v.to === id && v.in === spot) || null; }
// Трубка клапана: от выпуска вниз, потом наклонно к приёмнику, потом вниз в воронку банки или во вход подковы.
function valvePath(L, v){
  const r = ringById(L, v.from), p0 = spotPos(r, v.at), J = jarById(L, v.to);
  let tx, ty;
  if (J){ ty = funnelTop(J); tx = Math.abs(p0.x - J.x) <= CFG.FUNNEL_W / 2 - 0.14 ? p0.x : J.x; }
  else { const q = spotPos(ringById(L, v.to), v.in); tx = q.x; ty = q.y; }
  if (Math.abs(tx - p0.x) < 0.01) return [p0, { x: p0.x, y: ty }];
  return [p0, { x: p0.x, y: p0.y - CFG.PIPE_DROP }, { x: tx, y: ty + CFG.PIPE_DROP }, { x: tx, y: ty }];
}
// Куда съезжает цепочка из n доз в положении o (ячейка s стоит на θ = 45°·(o + s)): сумма высот минимальна.
// При равенстве — ближе к тому месту, где была (prev). Ядру это не нужно (сыпется всегда с нижнего конца), рендер и тест — пользуются.
function restOffset(o, n, prev){
  const cap = CFG.RING_CAP; let best = 0, bv = Infinity;
  for (let p = 0; p <= cap - n; p++){
    let v = 0; for (let j = 0; j < n; j++) v -= Math.cos(45 * (o + p + j) * DEG);
    const better = v < bv - 1e-9 || (Math.abs(v - bv) <= 1e-9 && prev !== undefined && Math.abs(p - prev) < Math.abs(best - prev));
    if (better){ bv = v; best = p; }
  }
  return best;
}

// Проверка раскладки уровня. Возвращает список ошибок.
function layoutErrors(L){
  const out = [], R = CFG.RING_R, T = CFG.TUBE_R;
  L.valves = L.valves || [];
  for (let i = 0; i < L.rings.length; i++) for (let k = i + 1; k < L.rings.length; k++){
    const a = L.rings[i], b = L.rings[k], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 2 * (R + T) + CFG.RING_GAP) out.push('подковы ' + a.id + ' и ' + b.id + ' задевают друг друга (d=' + d.toFixed(2) + ')');
  }
  const top = Math.max(...L.jars.map(funnelTop));
  for (const r of L.rings) if (r.y - R - T < top + 0.12) out.push('подкова ' + r.id + ' опускается в воронки банок');
  for (let i = 0; i < L.jars.length; i++) for (let k = i + 1; k < L.jars.length; k++)
    if (Math.abs(L.jars[i].x - L.jars[k].x) < Math.max(CFG.JAR_W, CFG.FUNNEL_W) + 0.06) out.push('банки ' + L.jars[i].id + ' и ' + L.jars[k].id + ' налезают');
  const used = new Set(), paths = [];
  for (const v of L.valves){
    const fi = ringIndex(L, v.from); if (fi < 0){ out.push('клапан ' + v.id + ': нет подковы ' + v.from); continue; }
    if (!OUTLET[v.at]) out.push('клапан ' + v.id + ': выпуск только BL/BR, а не ' + v.at);
    const key = v.from + v.at; if (used.has(key)) out.push('клапан ' + v.id + ': на выпуске ' + key + ' уже есть клапан'); used.add(key);
    const J = jarById(L, v.to), ti = ringIndex(L, v.to);
    if (!J && ti < 0){ out.push('клапан ' + v.id + ': нет приёмника ' + v.to); continue; }
    if (v.c && !COLORS[v.c]) out.push('клапан ' + v.id + ': цвет ' + v.c);
    if (J && v.c && v.c !== J.c) out.push('клапан ' + v.id + ' цвета ' + v.c + ' над банкой ' + J.c + ' — ничего не пройдёт');
    if (ti >= 0){
      if (ti === fi) out.push('клапан ' + v.id + ' ведёт в свою же подкову');
      if (!(v.in === 'TL' || v.in === 'TR')) out.push('клапан ' + v.id + ': вход подковы только TL/TR');
      const ik = v.to + v.in; if (used.has(ik)) out.push('клапан ' + v.id + ': вход ' + ik + ' занят'); used.add(ik);
    }
    const P = valvePath(L, v); paths.push({ v, P });
    if (P[P.length - 1].y > P[0].y - 0.3) out.push('клапан ' + v.id + ': приёмник не ниже выпуска');
    if (P.length === 4){ const dx = Math.abs(P[2].x - P[1].x), dy = P[1].y - P[2].y; if (dy < 0.75 * dx) out.push('клапан ' + v.id + ': трубка слишком полога (песок не съедет)'); }
    if (J && Math.abs(P[P.length - 1].x - J.x) > CFG.FUNNEL_W / 2 - 0.1) out.push('клапан ' + v.id + ': мимо воронки банки');
    // трубка не проходит сквозь чужие подковы и банки
    const len = P.slice(1).reduce((s, p, i) => s + Math.hypot(p.x - P[i].x, p.y - P[i].y), 0);
    for (let i = 1; i < P.length; i++){
      const a = P[i - 1], b = P[i], n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 0.04);
      for (let q = 0; q <= n; q++){
        const x = a.x + (b.x - a.x) * q / n, y = a.y + (b.y - a.y) * q / n;
        const along = P.slice(1, i).reduce((s, p, j) => s + Math.hypot(p.x - P[j].x, p.y - P[j].y), 0) + Math.hypot(x - a.x, y - a.y);
        L.rings.forEach((r, ri) => {
          if (ri === fi && along < 0.42) return; if (ri === ti && len - along < 0.42) return;
          const d = Math.abs(Math.hypot(x - r.x, y - r.y) - R);
          if (d < T + CFG.PIPE_R + 0.02) out.push('клапан ' + v.id + ': трубка задевает подкову ' + r.id);
        });
        for (const jj of L.jars) if (jj !== J && Math.abs(x - jj.x) < Math.max(CFG.JAR_W, CFG.FUNNEL_W) / 2 + CFG.PIPE_R && y < funnelTop(jj)) out.push('клапан ' + v.id + ': трубка проходит сквозь банку ' + jj.id);
      }
    }
  }
  // трубки не пересекаются
  const segX = (a, b, c, d) => { const o = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x)); return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0; };
  for (let i = 0; i < paths.length; i++) for (let k = i + 1; k < paths.length; k++){
    const A = paths[i].P, B = paths[k].P; let hit = false;
    for (let s = 1; s < A.length; s++) for (let t = 1; t < B.length; t++) if (segX(A[s - 1], A[s], B[t - 1], B[t])) hit = true;
    if (hit) out.push('трубки клапанов ' + paths[i].v.id + ' и ' + paths[k].v.id + ' пересекаются');
  }
  for (const j of L.jars) if (!(j.cap >= 1)) out.push('банка ' + j.id + ': объём ' + j.cap);
  for (const c of new Set([...L.jars.map(j => j.c), ...L.rings.flatMap(r => [...r.fill])])){
    const need = L.jars.filter(j => j.c === c).reduce((s, j) => s + j.cap, 0);
    const have = L.rings.reduce((s, r) => s + [...r.fill].filter(x => x === c).length, 0);
    if (have !== need) out.push('песка ' + c + ' не столько, сколько нужно банкам (' + have + ' ≠ ' + need + ')');
  }
  L.rings.forEach((r, ri) => {
    if (r.fill.length > ringCap(L, ri)) out.push('подкова ' + r.id + ' переполнена');
    if (!(r.o >= 0 && r.o < CFG.POS)) out.push('подкова ' + r.id + ': стартовое положение ' + r.o);
    if (r.lock && !L.jars.some(j => j.c === r.lock)) out.push('подкова ' + r.id + ': замок цвета без банки');
  });
  // на старте ни один конец не стоит в открытом клапане (иначе песок висел бы над открытым выпуском)
  if (!out.length){ const s = createState(-1, L); L.rings.forEach((r, ri) => { const f = flowFor(s, ri, s.ang[ri]); if (f.code === 'ok') out.push('подкова ' + r.id + ': на старте конец уже стоит в открытом клапане ' + f.valve); }); }
  return out;
}

// ---- состояние ----
function createState(li, def){
  const L = def || LEVELS[li]; L.valves = L.valves || [];
  return { li, L, rings: L.rings.map(r => [...r.fill]), ang: L.rings.map(r => posNorm(r.o || 0)), jars: L.jars.map(() => 0), moves: 0, hist: [] };
}
function cloneState(s){ return { li: s.li, L: s.L, rings: s.rings.map(r => r.slice()), ang: s.ang.slice(), jars: s.jars.slice(), moves: s.moves, hist: s.hist.slice() }; }
function stateKey(s){ return s.rings.map(r => r.join('')).join('|') + '@' + s.ang.join('') + '#' + s.jars.join(','); }
function jarFull(s, ji){ return s.jars[ji] >= s.L.jars[ji].cap; }
function lockOpen(s, color){ return s.L.jars.some((j, ji) => j.c === color && jarFull(s, ji)); }
function ringLocked(s, ri){ const c = s.L.rings[ri].lock; return !!c && !lockOpen(s, c); }
const moveOf = (ri, dir) => ri * 2 + (dir > 0 ? 0 : 1);
function endColor(arr, e){ return arr.length ? (e ? arr[arr.length - 1] : arr[0]) : null; }

// Пересыпание через клапан v из подковы si (положение so). recv — {ri, o}: положение подковы-приёмника, если она только что щёлкнула.
// code: ok | empty | wrongValve | wrongJar | jarFull | closedBelow | ringFull
function pourVia(s, v, si, so, recv, base){
  const L = s.L, src = s.rings[si], E = END_AT[so], n = src.length;
  const out = { ...base, src: si, srcId: L.rings[si].id, srcEnd: E.e, spot: v.at, valve: v.id, vc: v.c || '', to: v.to, color: null, amount: 0 };
  if (!n) return { ...out, code: 'empty' };
  const c = endColor(src, E.e); out.color = c;
  if (v.c && v.c !== c) return { ...out, code: 'wrongValve' };
  let run = 0; while (run < n && src[E.e ? n - 1 - run : run] === c) run++;
  let space;
  const ji = jarIndex(L, v.to);
  if (ji >= 0){
    const J = L.jars[ji];
    if (J.c !== c) return { ...out, code: 'wrongJar', jarColor: J.c };
    space = J.cap - s.jars[ji]; if (space <= 0) return { ...out, code: 'jarFull' };
    out.ji = ji;
  } else {
    const ti = ringIndex(L, v.to), to = recv && recv.ri === ti ? recv.o : s.ang[ti], TE = END_AT[to];
    out.ti = ti;
    if (TE.spot !== v.in) return { ...out, code: 'closedBelow' };
    space = ringCap(L, ti) - s.rings[ti].length; if (space <= 0) return { ...out, code: 'ringFull' };
    out.toEnd = TE.e;
  }
  return { ...out, code: 'ok', amount: Math.min(run, space), run };
}
// Что случится, когда подкова ri встанет в положение o. code: ok (сыплется) | rest (ничего) | closed (нижний конец — без клапана) | locked | …(pourVia)
function flowFor(s, ri, o){
  const L = s.L, E = END_AT[posNorm(o)], base = { ri, from: L.rings[ri].id, k: posNorm(o), end: E.e, at: E.spot };
  if (OUTLET[E.spot]){
    const v = valveAt(L, ri, E.spot);
    if (!v) return { ...base, code: 'closed', color: endColor(s.rings[ri], E.e), amount: 0 };
    return pourVia(s, v, ri, posNorm(o), null, base);
  }
  const v = inletValve(L, ri, E.spot);
  if (!v) return { ...base, code: 'rest', amount: 0 };
  const si = ringIndex(L, v.from);
  if (END_AT[s.ang[si]].spot !== v.at) return { ...base, code: 'rest', amount: 0, inlet: v.id };
  return pourVia(s, v, si, s.ang[si], { ri, o: posNorm(o) }, { ...base, feed: true });
}
// Ход m: щелчок подковы m>>1 по часовой (m чётный) или против. Возвращает положение после щелчка и что пересыплется.
function moveInfo(s, m){
  const ri = m >> 1, dir = (m & 1) ? -1 : 1;
  if (ri >= s.L.rings.length) return { m, ri, dir, code: 'none', amount: 0 };
  if (ringLocked(s, ri)) return { m, ri, dir, from: s.L.rings[ri].id, code: 'locked', lock: s.L.rings[ri].lock, k: s.ang[ri], amount: 0 };
  return { m, dir, ...flowFor(s, ri, s.ang[ri] + dir) };
}
function legalMoves(s){ const out = []; for (let ri = 0; ri < s.L.rings.length; ri++) if (!ringLocked(s, ri)) out.push(ri * 2, ri * 2 + 1); return out; }
function applyMove(s, m){
  const info = moveInfo(s, m); if (info.code === 'locked' || info.code === 'none') return s;
  const n = cloneState(s), L = s.L;
  n.hist.push({ rings: s.rings, ang: s.ang, jars: s.jars });
  n.ang[info.ri] = info.k;
  if (info.code === 'ok'){
    const src = n.rings[info.src];
    if (info.srcEnd) src.splice(src.length - info.amount, info.amount); else src.splice(0, info.amount);   // уходит только с конца в клапане

function isWin(s){ return s.jars.every((f, ji) => f >= s.L.jars[ji].cap); }

// Солвер: поиск в ширину по «положения × цепочки × банки», кратчайшая победная последовательность щелчков или null (тупик).
function solve(s){
  if (isWin(s)) return [];
  const start = { rings: s.rings.map(r => r.slice()), ang: s.ang.slice(), jars: s.jars.slice(), L: s.L, hist: [], moves: 0 };
  const seen = new Map([[stateKey(start), null]]), q = [start];
  for (let qi = 0; qi < q.length && seen.size < CFG.SOLVE_LIMIT; qi++){
    const cur = q[qi], ck = stateKey(cur);

      const nx = applyMove(cur, m); nx.hist = []; const k = stateKey(nx);
      if (seen.has(k)) continue;
      seen.set(k, { from: ck, move: m });
      if (isWin(nx)){ const path = []; let at = k; while (seen.get(at)){ path.push(seen.get(at).move); at = seen.get(at).from; } return path.reverse(); }

}
// Полный граф уровня: сколько состояний, сколько тупиков; good — множество состояний, откуда победа достижима;
// dist — щелчков до победы из состояния (обратный поиск в ширину от побед). Строится генератором: sim и тесты прогоняют его разом
// (graphOf), игра — порциями между кадрами (graphAsync), чтобы большой уровень не подвешивал экран.
const GRAPH = new WeakMap(), GRAPH_PENDING = new WeakMap();

    const cur = q[qi], ck = stateKey(cur);
    for (const m of legalMoves(cur)){

    do r = it.next(); while (!r.done && Date.now() - t0 < (budget || 8));

// Короткий перебор от состояния: путь, null — тупик наверняка, undefined — не уложились в предел (неизвестно).
function solveLimited(s, limit){

  const start = { rings: s.rings.map(r => r.slice()), ang: s.ang.slice(), jars: s.jars.slice(), L: s.L, hist: [], moves: 0 };
  const seen = new Map([[stateKey(start), null]]), q = [start];

      if (seen.has(k)) continue;
      seen.set(k, { from: ck, move: m });
      if (isWin(nx)){ const path = []; let at = k; while (seen.get(at)){ path.push(seen.get(at).move); at = seen.get(at).from; } return path.reverse(); }

// Подсказка по графу: щелчок к соседу, ближайшему к победе. Граф не готов — короткий перебор; null — тупик/неизвестно.

}

  const g = graphOf(s.L), k = stateKey(s); if (g.seen.has(k)) return !g.good.has(k); return solve(s) === null; }

// Крутить одну подкову в одну сторону от старта: на каком щелчке тупик (0 — не наступает за полный оборот).
function spinTrap(s, ri, dir){
  let t = s;

  return { dead: 0 };
}

// ---- причина тупика человеческими словами ----
// Есть ли дорога из подковы ri до банки цвета c через клапаны, которые его пропускают.
function routeTo(L, ri, c, seen){
  seen = seen || new Set(); if (seen.has(ri)) return false; seen.add(ri);
  return L.valves.some(v => v.from === L.rings[ri].id && (!v.c || v.c === c) &&
    (jarById(L, v.to) ? jarById(L, v.to).c === c : routeTo(L, ringIndex(L, v.to), c, seen)));
}
const ringName = (L, ri) => 'подкову ' + L.rings[ri].id;
function valveWord(c){ return c ? COLORS[c].nom : 'прозрачный'; }
function deadReason(s){
  if (isWin(s) || !isDead(s)) return null;
  const L = s.L;
  // 1) нужный цвет попал туда, откуда к своей банке дороги нет
  for (const [ji, J] of L.jars.entries()){
    if (jarFull(s, ji)) continue; const C = COLORS[J.c];
    for (let ri = 0; ri < L.rings.length; ri++) if (s.rings[ri].includes(J.c) && !routeTo(L, ri, J.c))
      return cap1(C.nom) + ' попал в ' + ringName(L, ri) + ', а из неё ' + C.dat + ' не попасть в ' + C.acc + ' банку.';
  }
  // 2) подкова заперта: ни с одного конца ничего не уйдёт туда, откуда есть дорога
  for (let ri = 0; ri < L.rings.length; ri++){
    const arr = s.rings[ri]; if (!arr.length) continue;
    const outs = L.valves.filter(v => v.from === L.rings[ri].id);
    const can = (c) => outs.some(v => (!v.c || v.c === c) && (jarById(L, v.to) ? jarById(L, v.to).c === c && !jarFull(s, jarIndex(L, v.to))
      : s.rings[ringIndex(L, v.to)].length < ringCap(L, ringIndex(L, v.to)) && routeTo(L, ringIndex(L, v.to), c)));
    const e0 = arr[0], e1 = arr[arr.length - 1];
    if (can(e0) || can(e1)) continue;
    if (!outs.length) continue;
    const vs = [...new Set(outs.map(v => v.c))];
    const ends = e0 === e1 ? 'У обоих концов подковы ' + L.rings[ri].id + ' ' + COLORS[e0].nom : 'У концов подковы ' + L.rings[ri].id + ' ' + COLORS[e0].nom + ' и ' + COLORS[e1].nom;
    if (vs.every(c => c)) return ends + ', а ' + (vs.length > 1 ? 'клапаны ' + vs.map(valveWord).join(' и ') : 'клапан ' + valveWord(vs[0])) + ' — не пропустит.';
    const full = outs.find(v => !jarById(L, v.to) && s.rings[ringIndex(L, v.to)].length >= ringCap(L, ringIndex(L, v.to)));
    if (full) return ends + ', а подкова ' + full.to + ' под ней полна.';
    return ends + ', а дальше им дороги нет.';
  }
  // 3) нужный цвет зажат в середине цепочки
  for (const [ji, J] of L.jars.entries()){
    if (jarFull(s, ji)) continue; const C = COLORS[J.c];
    for (let ri = 0; ri < L.rings.length; ri++){ const a = s.rings[ri], i = a.indexOf(J.c);
      if (i > 0 && a.lastIndexOf(J.c) < a.length - 1) return cap1(C.nom) + ' зажат в середине ' + 'подковы ' + L.rings[ri].id + ': то, что по краям, снять уже некуда.'; }
  }
  const lk = L.rings.findIndex((r, ri) => ringLocked(s, ri));
  if (lk >= 0) return 'Подкова ' + L.rings[lk].id + ' под замком, а ' + COLORS[L.rings[lk].lock].acc + ' банку уже не насыпать.';

}

// Боты для симулятора (PROTO-BASE §6).
// Случайный — любой щелчок. «Ближайшая банка» (жадный) — крутит ту подкову и в ту сторону, где банка пополнится
// за меньше щелчков (при равенстве — по часовой); если банку не достать — к ближайшему пересыпанию; «только по часовой» — то же, только тапами.
function randomRun(li, seed, def){
  const rnd = mulberry32(seed); let s = createState(li, def);
  for (let k = 0; k < 100 && !isWin(s); k++){ const m = legalMoves(s); if (!m.length) break; s = applyMove(s, m[Math.floor(rnd() * m.length)]); }

    const nx = applyMove(t, moveOf(ri, dir));
    if (jarDoses(nx) > jarDoses(t)) return n;
    if (!jarOnly && info.code === 'ok') return n + 0.5;
    t = nx;
  }

}
function botRun(li, dirs, def){
  let s = createState(li, def); const path = [];
  for (let step = 0; step < 80 && !isWin(s); step++){
    let best = null, bn = Infinity;
    for (const jarOnly of [true, false]){
      for (let ri = 0; ri < s.L.rings.length; ri++) for (const d of dirs){ const n = clicksTo(s, ri, d, jarOnly); if (n < bn){ bn = n; best = moveOf(ri, d); } }
      if (best !== null) break;
    }
    if (best === null){                                   // одной подковой ничего не пересыпать — подготовить другой: X на n щелчков, потом Y
      for (let ri = 0; ri < s.L.rings.length; ri++) for (const d of dirs){ let t = s;
        for (let n = 1; n <= CFG.POS; n++){ if (moveInfo(t, moveOf(ri, d)).code === 'locked') break; t = applyMove(t, moveOf(ri, d));

    }

}
function greedyRun(li, def){ return botRun(li, [1, -1], def); }
function cwRun(li, def){ return botRun(li, [1], def); }

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---

const $ = (id) => document.getElementById(id);

      <li>Подкова снизу примет песок, если её конец стоит во входе клапана. Зажми подкову — увидишь, что даст щелчок.</li></ul>

  if (screen === 'win'){

$('card').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act; Snd.init(); log('input', 'button', act); Snd.tick();
  if (act === 'play') startLevel(Math.min(G.save.level, LEVELS.length - 1));
  else if (act === 'lv') startLevel(+b.dataset.i);
  else if (act === 'retry') startLevel(G.s ? G.s.li : 0);
  else if (act === 'next'){ const li = G.s ? G.s.li + 1 : 0; if (li >= LEVELS.length) goto('menu'); else startLevel(li); }
  else if (act === 'help') goto('help');

});
window.addEventListener('hashchange', () => routeHash());
function routeHash(){
  const h = location.hash.slice(1); if (!h) return false;
  const m = /^(?:level|l)(\d+)$/.exec(h);
  if (m){ startLevel(Math.max(0, Math.min(LEVELS.length - 1, +m[1] - 1))); return true; }
  if (h === 'game'){ startLevel(Math.min(G.save.level, LEVELS.length - 1)); return true; }
  if (h === 'win'){ if (!G.s) startLevel(0); goto('win', { text: 'Эталонный кадр экрана победы', clean: true }); return true; }
  if (['menu', 'help'].includes(h)){ goto(h); return true; }
  return false;
}
let toastUntil = 0;

function hud(){

}
function showDead(reason){
  G.dead = reason;
  $('dead-text').textContent = reason; $('dead').classList.add('show'); $('btn-undo').classList.add('pulse');
  log('event', 'dead', reason); Snd.dead(); buzz([30, 60, 30]); hud();
}
function hideDead(){ G.dead = null; $('dead').classList.remove('show'); $('btn-undo').classList.remove('pulse'); }

// Граф уровня (до ~35 тыс. состояний) считается после первого кадра: не держит ни старт, ни показ уровня. par и тупики — оттуда.
function scheduleAnalyze(){
  if (!G.booted){ G.needAnalyze = true; return; }
  const L = G.s && G.s.L; if (!L) return;
  setTimeout(() => { if (!G.s || G.s.L !== L) return; const t0 = performance.now();
    graphAsync(L, (g) => { if (!G.s || G.s.L !== L) return; const d = g.dist.get(stateKey(createState(G.s.li))); G.par = d === undefined ? -1 : d;
      log('event', 'level.start', 'level=' + (G.s.li + 1) + ' par=' + G.par + ' states=' + g.seen.size + ' dead=' + (g.seen.size - g.good.size) + ' graph=' + Math.round(performance.now() - t0) + 'ms');
      if (!G.pour && !G.ending){ const reason = deadReason(G.s); if (reason) showDead(reason); } }); }, 80);
}
function startLevel(li){
  G.s = createState(li); G.view = cloneState(G.s); G.pour = null; G.press = null; G.fx = []; G.ending = 0; G.hint = null; G.punch = 0; G.flashBg = 0; if (R3) R3.parts = [];
  hideDead();
  // граф уровня (до ~35 тыс. состояний) считается после первого кадра, чтобы не держать показ уровня; par и тупики — оттуда
  G.par = -1; scheduleAnalyze();
  if (R3) buildLevel(G.s.L);
  goto('game'); hud();
  if (li === 0 && !G.save.done[0]) setTimeout(() => { if (G.s && G.s.li === 0 && !G.s.moves){ const m = hintMove(G.s); if (m !== null) G.hint = { m, until: now() + 4000 }; } }, 900);
}

// 3D: рендерер, окружение, материалы. Всё строится кодом из именованных функций (§11), модели Tripo — файлами.
// ===========================================================================
let R3 = null;
const GLB = {};                // id → модель из assets/models (если загрузилась)
const MODEL_IDS = ['valve', 'lid', 'lock', 'stand'];

// Шейдеры. Цвета в юниформах — линейные, в конце colorspace_fragment переводит в sRGB.
const SH_VERT = `
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vO = position;
  vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz);
  gl_Position = projectionMatrix * viewMatrix * w;

// Песок дозой в трубке: зерно (хеш-шум по координатам), тёмные швы между дозами, искорки. Доза — дуга 45°, показывается её часть uLo..uHi
// (0 — со стороны E1, 1 — со стороны E0): так доза «вытекает» в клапан и «наползает» в приёмнике. uHi — мигание в превью.
const SH_SAND = `
uniform vec3 uCol; uniform vec3 uLight; uniform float uLo; uniform float uHi; uniform float uBlink; uniform float uTime; uniform float uGhost;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
void main(){
  float f = atan(vO.y, vO.x) / 0.7853982;
  if (f < uLo || f > uHi) discard;
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  vec3 L = normalize(uLight);
  float g = h3(floor(vO * 70.0)), g2 = h3(floor(vO * 31.0) + 7.0);
  float lam = 0.55 + 0.45 * clamp(dot(N, L), 0.0, 1.0);
  float ndv = clamp(dot(N, vV), 0.0, 1.0);
  vec3 c = uCol * lam * (0.82 + 0.3 * g + 0.12 * g2);
  c *= 0.78 + 0.32 * ndv;
  float seam = smoothstep(0.035, 0.0, f - uLo) * step(0.001, 1.0 - uLo) + smoothstep(0.965, 1.0, f) * step(uHi, 0.999) * 0.0;
  float edge = min(f, 1.0 - f); c *= mix(0.72, 1.0, smoothstep(0.0, 0.06, edge));
  c += vec3(1.0) * step(0.985, h3(floor(vO * 90.0) + floor(uTime * 3.0))) * 0.35 * ndv;
  if (uBlink > 0.5) c = mix(c, vec3(1.0), 0.2 + 0.16 * sin(uTime * 10.0));
  float a = 1.0;
  if (uGhost > 0.5){ a = 0.55 + 0.2 * sin(uTime * 8.0); c = mix(uCol, vec3(1.0), 0.25); }
  gl_FragColor = vec4(c, a);
  #include <colorspace_fragment>
}`;
// Песок в банке: срез — горка (конус от края к середине), сверху светлее; выше — отрезано. uGhost — «призрак» прихода.
const SH_HEAP = `
uniform vec3 uCol; uniform vec3 uLight; uniform float uTop; uniform float uHeap; uniform vec2 uC; uniform float uR; uniform float uTime;
uniform float uGhost; uniform float uGhostTop; uniform vec3 uGhostC;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
void main(){
  float r = length(vW.xz - uC) / uR;
  float surf = uTop + uHeap * (1.0 - clamp(r, 0.0, 1.0));
  bool ghost = false;
  if (vW.y > surf){ if (uGhost > 0.5 && vW.y < uGhostTop + uHeap * (1.0 - clamp(r, 0.0, 1.0))) ghost = true; else discard; }
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  vec3 L = normalize(uLight);
  float g = h3(floor(vW * 60.0));
  vec3 c = uCol * (0.6 + 0.4 * clamp(dot(N, L), 0.0, 1.0)) * (0.84 + 0.28 * g);
  if (!gl_FrontFacing) c = uCol * (1.05 + 0.2 * g);
  float top = smoothstep(surf - 0.05, surf, vW.y); c = mix(c, uCol * 1.15 + 0.08, top * 0.6);
  float a = 1.0;
  if (ghost){ a = 0.5 + 0.2 * sin(uTime * 8.0); c = mix(uGhostC, vec3(1.0), 0.3); }
  gl_FragColor = vec4(c, a);
  #include <colorspace_fragment>
}`;
// Стекло: прозрачная основа, френель по краю, два блика. Без второго прохода рендера (дёшево на телефоне).
const SH_GLASS = `
uniform vec3 uTint; uniform vec3 uLight; uniform float uAlpha; uniform float uBack;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec3 vO;
void main(){
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  float ndv = clamp(abs(dot(N, vV)), 0.0, 1.0);
  float fr = pow(1.0 - ndv, 2.4);
  vec3 L = normalize(uLight);
  float sp = pow(max(dot(N, normalize(L + vV)), 0.0), 140.0) * 1.5;
  vec3 Rf = reflect(-vV, N);
  float strip = smoothstep(0.78, 0.9, Rf.y * 0.85 - Rf.x * 0.4);
  float a = uAlpha + fr * 0.6 + sp + strip * 0.45;
  vec3 c = mix(uTint, vec3(1.0), clamp(fr * 0.7 + sp + strip, 0.0, 1.0));
  gl_FragColor = vec4(c, clamp(a, 0.0, 0.95) * (uBack > 0.5 ? 0.45 : 1.0));
  #include <colorspace_fragment>
}`;
// Жёлоб клапана: непрозрачный открытый лоток цвета клапана. uv.x — поперёк дна (−1..1), 3 — кромка; uv.y — путь от выпуска, мировые ед.
// Шевроны бегут вниз по пути (направление), песок струйкой — полоса по дну между uFlowA и uFlowB. uGlow — подсветка дороги при касании,
// uDim — приглушить чужие дороги, пока палец на подкове.
const SH_TROUGH_VERT = `
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vUv = uv; vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const SH_TROUGH = `
uniform vec3 uCol; uniform vec3 uStripe; uniform vec3 uRim; uniform vec3 uLight; uniform float uTime; uniform float uPhase; uniform float uGlow; uniform float uDim;
uniform float uFlowA; uniform float uFlowB; uniform vec3 uSandCol;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
void main(){
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  float lam = 0.62 + 0.38 * clamp(dot(N, normalize(uLight)), 0.0, 1.0);
  float x = vUv.x, s = vUv.y;
  vec3 c;
  float pulse = 0.55 + 0.45 * sin(uTime * 7.0);
  if (x > 1.5) c = mix(uRim, vec3(1.0, 0.98, 0.85), uGlow * (0.6 + 0.4 * pulse));
  else {
    float ph = fract((s + abs(x) * 0.15) / 0.3 - uPhase);
    float chev = smoothstep(0.0, 0.05, ph) * smoothstep(0.45, 0.39, ph);
    c = mix(uCol, uStripe, chev);
    c *= 0.74 + 0.26 * (1.0 - x * x);
    float inFlow = step(uFlowA, s) * step(s, uFlowB) * step(abs(x), 0.62);
    if (inFlow > 0.5){
      float g = h3(floor(vec3((s - uTime * 2.6) * 55.0, x * 12.0, 1.0))), g2 = h3(floor(vec3((s - uTime * 2.1) * 23.0, x * 5.0, 3.0)));

      sc *= mix(0.7, 1.0, smoothstep(0.62, 0.45, abs(x)));
      sc += vec3(1.0) * step(0.97, h3(floor(vec3((s - uTime * 2.6) * 80.0, x * 18.0, 5.0)))) * 0.3;
      c = sc;
    }
  }
  c *= lam;
  if (x < 1.5) c *= 1.0 + 0.22 * uGlow * pulse;
  float l = dot(c, vec3(0.3, 0.55, 0.15));
  c = mix(c, mix(vec3(l), c, 0.45) * 0.82, uDim);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}`;
// Ореол под жёлобом при подсветке: мягкая полоса цвета клапана, uv.x поперёк (−1..1).
const SH_GLOW = `
uniform vec3 uCol; uniform float uGlow; uniform float uTime;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main(){
  float k = smoothstep(1.0, 0.5, abs(vUv.x));
  gl_FragColor = vec4(uCol * 1.15 + vec3(0.06), uGlow * k * (0.8 + 0.2 * sin(uTime * 7.0)));
  #include <colorspace_fragment>

// Муфта на трубке подковы в точке θ (как цветные муфты на референсе): тор вокруг трубки, ось — по касательной.

// Жёлоб по осевой C: открытый к камере полужёлоб (дно — полукруг радиуса wi), кромка шириной w − wi, снаружи — полукруг w.

function makeTrough(P, c, toJar){

  if (Q.length > 2 && Math.hypot(Q[1].x - Q[0].x, Q[1].y - Q[0].y) < 0.12) Q.splice(1, 1);
  if (Q.length > 2 && Math.hypot(Q[Q.length - 1].x - Q[Q.length - 2].x, Q[Q.length - 1].y - Q[Q.length - 2].y) < 0.12) Q.splice(Q.length - 2, 1);

// Подкова в локальных координатах (положение o = 0): стекло, две заглушки на концах, 6 доз песка (видны по числу доз в цепочке).

    const deg = endDeg(0, e), p = rimAt({ x: 0, y: 0 }, deg), dir = e ? 1 : -1;      // E0 смотрит против часовой, E1 — по часовой (наружу из дуги)

function pointerAngle(P, e){ const rect = cv.getBoundingClientRect(); return Math.atan2(e.clientY - rect.top - P.cy, e.clientX - rect.left - P.cx); }
cv.addEventListener('pointerdown', (e) => {
  Snd.init(); if (G.screen !== 'game' || !G.s || G.ending || G.press) return;
  const ri = pickRing(e.clientX, e.clientY);
  if (ri < 0){ log('input', 'miss'); return; }
  if (ringLocked(G.s, ri)){ log('input', 'press', 'ring=' + G.s.L.rings[ri].id + ' locked'); const info = moveInfo(G.s, moveOf(ri, 1)); Snd.deny(); buzz(15); toast(denyText(info)); R3.level.rings[ri].shake = now(); return; }
  const s = ringScreen(ri);
  G.press = { ri, id: e.pointerId, x: e.clientX, y: e.clientY, cx: s.x, cy: s.y, rpx: s.rpx, a: 0, acc: 0, drag: false, dir: 0, clicks: 0 };
  G.press.a = pointerAngle(G.press, e);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  G.hint = null;
  log('input', 'press', 'ring=' + G.s.L.rings[ri].id);
});
cv.addEventListener('pointermove', (e) => {
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  const rect = cv.getBoundingClientRect(), dx = e.clientX - rect.left - P.cx, dy = e.clientY - rect.top - P.cy;
  if (!P.drag && Math.hypot(e.clientX - P.x, e.clientY - P.y) > VIEW.TAP_PX){ P.drag = true; log('input', 'drag', 'ring=' + G.s.L.rings[P.ri].id); }
  const a = pointerAngle(P, e);
  if (Math.hypot(dx, dy) < P.rpx * 0.3){ P.a = a; return; }             // у центра угол пляшет — не крутим
  let d = a - P.a; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; P.a = a;
  if (!P.drag) return;
  P.acc += d;
  if (Math.abs(d) > 0.004) P.dir = d > 0 ? 1 : -1;            // превью — по направлению движения пальца
  while (!G.pour && !G.ending && Math.abs(P.acc) >= STEP * 0.5){
    const dir = P.acc > 0 ? 1 : -1;
    P.acc -= dir * STEP; P.clicks++;
    if (!turnRing(P.ri, dir, 'drag')) { P.acc = 0; break; }
  }
  if (G.pour) P.acc = Math.max(-STEP * 0.3, Math.min(STEP * 0.3, P.acc));
});
function onUp(e){
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  G.press = null;
  const R = R3 && R3.level && R3.level.rings[P.ri];
  if (R && P.drag){ R.anim = { from: R.vis, to: R.cont, t0: now(), ms: 140, back: false }; }
  if (e.type === 'pointercancel') return;
  if (!P.drag && !P.clicks) turnRing(P.ri, 1, 'tap');
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {            // дубли на клавиатуру для отладки (§3): цифра — по часовой, Shift+цифра — против
  const mm = /^Digit([1-9])$/.exec(e.code);
  if (mm && G.s) turnRing(+mm[1] - 1, e.shiftKey ? -1 : 1, 'key');
  if (e.key === 'z' || e.key === 'u') undo(); if (e.key === 'r' && G.s) startLevel(G.s.li); if (e.key === 'm') goto('menu'); if (e.key === 'h') showHint();
});
$('btn-undo').onclick = () => { Snd.init(); log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { Snd.init(); log('input', 'button', 'reset'); if (G.s) startLevel(G.s.li); };
$('btn-hint').onclick = () => { Snd.init(); log('input', 'button', 'hint'); if (G.s && !G.pour) showHint(); };
$('btn-menu').onclick = () => { Snd.init(); log('input', 'button', 'menu'); goto('menu'); };
$('btn-mute').onclick = () => { Snd.init(); G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };
$('dead-undo').onclick = () => { Snd.init(); log('input', 'button', 'dead.undo'); undo(); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
let lastW = 0, lastH = 0;
function fit(){
  if (!R3) return;
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  if (r.width === lastW && r.height === lastH) return; lastW = r.width; lastH = r.height;
  R3.renderer.setPixelRatio(R3.dpr); R3.renderer.setSize(r.width, r.height, false);
  R3.camera.aspect = r.width / r.height; frameCamera();
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// --- кадр ---
function renderFrame(){
  if (!R3) return;
  const tNow = now(), t0 = performance.now();
  if (R3.level && G.view){
    updatePour(tNow);
    syncView(tNow);
    updateFx(tNow);
    updateParts(tNow);
    const F = window.KLAPANY && window.KLAPANY.flags;
    if (F && F.noParts){ R3.grains.count = 0; R3.drops.count = 0; R3.conf.count = 0; R3.stars.count = 0; }
    applyPunch(tNow);
  }
  R3.renderer.render(R3.scene, R3.camera);
  const dt = performance.now() - t0;
  R3.frames.push(dt); if (R3.frames.length > 240) R3.frames.shift();
  if (G.ending && tNow >= G.ending){
    G.ending = 0; const clean = G.par > 0 && G.s.moves <= G.par;
    goto('win', { clean, last: G.s.li >= LEVELS.length - 1 });
  }
  if (toastUntil && tNow > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}
// Победа: камера чуть «толкается» вперёд, фон вспыхивает тёплым светом и гаснет.
const _dir = new THREE.Vector3(), _bgTop = new THREE.Color(), _bgBot = new THREE.Color(), _warm = new THREE.Color('#fff1c4');
function applyPunch(tNow){
  if (G.punch){ const k = (tNow - G.punch) / (650 / G.timeScale); frameCamera();
    if (k >= 1) G.punch = 0; else { R3.camera.getWorldDirection(_dir); R3.camera.position.addScaledVector(_dir, 0.55 * Math.sin(Math.min(1, k * 1.6) * Math.PI) * (1 - k)); } }
  const u = R3.bg.material.uniforms;
  if (G.flashBg){ const k = (tNow - G.flashBg) / (700 / G.timeScale), f = k >= 1 ? 0 : 0.55 * Math.pow(1 - k, 2);
    u.uTop.value.copy(_bgTop.copy(lin(VIEW.BG_TOP)).lerp(_warm, f)); u.uBot.value.copy(_bgBot.copy(lin(VIEW.BG_BOTTOM)).lerp(_warm, f * 0.7)); if (k >= 1) G.flashBg = 0; }
}
// rAF + watchdog setInterval: безопасно, потому что время абсолютное (§4)
let lastFrame = 0;
function spinning(){ const lv = R3 && R3.level; return !!(lv && (G.spinDemo || (G.press && G.press.drag) || lv.rings.some(R => R.anim || R.p !== R.pT))); }
function frame(ts){
  const t = performance.now();
  if (G.bench && lastFrame){ if (G.ending || G.screen === 'win') G.bench.win.push(t - lastFrame); else if (G.pour) G.bench.pour.push(t - lastFrame); else if (spinning()) G.bench.spin.push(t - lastFrame); }
  lastFrame = t; if (!G.paused) renderFrame(); requestAnimationFrame(frame);
}
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) renderFrame(); }, 40);

// --- дебаг-хук (§6) ---
const waitFrames = () => new Promise(res => requestAnimationFrame(res));
function benchStats(ints){
  ints = ints.slice().sort((a, b) => a - b); const avg = ints.reduce((a, b) => a + b, 0) / Math.max(1, ints.length);
  return { frames: ints.length, fps: +(1000 / Math.max(1e-6, avg)).toFixed(1), p95ms: +(ints[Math.floor(ints.length * 0.95)] || 0).toFixed(1), long: ints.filter(x => x > 25).length };
}
window.KLAPANY = {
  G, LEVELS, PERF, get R3(){ return R3; },
  state(){ return G.s ? { level: G.s.li + 1, name: G.s.L.name, rings: G.s.rings.map(r => r.join('') || '·').join(' '), ang: G.s.ang.join(''), jars: G.s.jars.join('/'), moves: G.s.moves, par: G.par,
    win: isWin(G.s), dead: G.dead, pouring: !!G.pour, screen: G.screen } : { screen: G.screen }; },
  play(n){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1)); return this.state(); },
  turn(ri, dir){ turnRing(ri, dir || 1, 'key'); return this.state(); },
  tap(ri){ turnRing(ri, 1, 'tap'); return this.state(); },
  press(ri, dir){ G.press = { ri, id: -1, x: 0, y: 0, cx: 0, cy: 0, rpx: 1, a: 0, acc: 0, drag: false, dir: dir || 0, clicks: 0 }; return moveInfo(G.s, moveOf(ri, dir || 1)); },
  release(){ const P = G.press; G.press = null; return P ? turnRing(P.ri, P.dir || 1, 'tap') : false; },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(){ return G.s ? solve(G.s) : null; },
  hint(){ showHint(); return G.hint; },
  auto(delayMs){ const path = this.solve() || []; path.forEach((m, k) => setTimeout(() => turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto'), (delayMs || 1400) * k)); return path; },
  drive(sec, stepMs){                         // ручной прогон времени: rAF заморожен в скрытой вкладке/превью
    const step = stepMs || 1000 / 60, n = Math.round(sec * 1000 / step);
    for (let i = 0; i < n; i++){ T.off += step; renderFrame(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  rings(){ return G.s ? G.s.L.rings.map((r, ri) => ({ ri, id: r.id, o: G.s.ang[ri], locked: ringLocked(G.s, ri), screen: R3 && R3.level ? ringScreen(ri) : null, cw: moveInfo(G.s, moveOf(ri, 1)).code, ccw: moveInfo(G.s, moveOf(ri, -1)).code })) : []; },
  // замер кадра: прогоняет решение текущего уровня на реальном rAF; интервалы кадров отдельно — во время пересыпаний и во время кручения
  async bench(rounds){
    rounds = rounds || 2; const li = G.s ? G.s.li : 2, cpu = []; G.bench = { pour: [], spin: [], win: [] };
    for (let r = 0; r < rounds; r++){
      startLevel(li); await new Promise(res => setTimeout(res, 300));
      for (const m of (solve(G.s) || [])){
        R3.frames.length = 0; turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto');
        while (G.pour || spinning()) await waitFrames();
        cpu.push(...R3.frames);
        await new Promise(res => setTimeout(res, 60));
      }
    }
    for (const t0 = performance.now(); performance.now() - t0 < 3500;) await waitFrames();     // праздник и карточка победы — отдельной корзиной
    startLevel(li); await new Promise(res => setTimeout(res, 300));
    G.spinDemo = now(); for (const t0 = performance.now(); performance.now() - t0 < 2000;) await waitFrames(); G.spinDemo = 0;
    const B = G.bench; G.bench = null; cpu.sort((a, b) => a - b);
    const out = { pour: benchStats(B.pour), spin: benchStats(B.spin), win: benchStats(B.win), cpuAvgMs: +(cpu.reduce((a, b) => a + b, 0) / Math.max(1, cpu.length)).toFixed(2),
      cpuP95ms: +(cpu[Math.floor(cpu.length * 0.95)] || 0).toFixed(2), dpr: R3.dpr, size: R3.renderer.domElement.width + '×' + R3.renderer.domElement.height };
    log('event', 'bench', JSON.stringify(out)); return out;
  },
  startup(){ return PERF; },
  get R3(){ return R3; },
  flags: {},                                   // замер по частям: noParts — выключить частицы и сравнить кадр
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт: меню сразу (DOM), GL и модели — следом; холст проявляется, когда шейдеры собраны и прогреты ---
hud();
if (!routeHash()) goto('menu');
mark('menu');
(async function boot(){
  try {
    await new Promise(r => setTimeout(r, 0));
    initRenderer();
    lastW = 0; fit();
    await Promise.race([loadModels(), new Promise(r => setTimeout(r, 6000))]);
    if (!G.s) { G.s = createState(Math.min(G.save.level, LEVELS.length - 1)); G.view = cloneState(G.s); G.par = -1; G.needAnalyze = true; }
    buildLevel(G.s.L, true); mark('level');
    if (R3.renderer.compileAsync) await R3.renderer.compileAsync(R3.scene, R3.camera); mark('compile');
    warmUp(); renderFrame(); mark('firstFrame');
    $('gl').classList.add('ready'); hud();
    requestAnimationFrame(frame);
    G.booted = true; if (G.needAnalyze){ G.needAnalyze = false; scheduleAnalyze(); }
    log('event', 'boot', 'levels=' + LEVELS.length + ' glb=' + Object.keys(GLB).join(','));
  } catch (err) { console.error(err); log('event', 'boot.fail', err.message); toast('3D не запустился: ' + err.message, 6000); }
})();
}
</script>
